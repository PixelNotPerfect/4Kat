<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Premiers pas — le voyage d'un chaton</title>
<!--
  PREMIERS PAS
  Motion design 3D interactif et autonome : un chaton noir (une tache blanche
  sur le museau) découvre le monde, de l'aube à la nuit.

  - Un seul fichier : HTML + CSS + JavaScript. Three.js est chargé depuis un CDN.
  - Aucun asset externe : géométries, textures et sons sont générés par le code.
  - Palette noir et blanc ; deux accents seulement, réservés aux événements
    (corail : papillon et cœurs ; or : lucioles).

  Paramètres d'URL facultatifs (pratiques pour régler une scène) :
    ?scene=2   démarre directement au chapitre indiqué (1 à 5)
    ?speed=3   multiplie la vitesse du récit
-->
<style>
  :root { --serif: "Cormorant Garamond", "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #f4f4f1; }
  body { font-family: var(--serif); -webkit-font-smoothing: antialiased; }

  /* Le canvas WebGL occupe toute la fenêtre. */
  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  /* Vignette très légère pour refermer le cadre. */
  #vignette {
    position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(0, 0, 0, .16) 100%);
  }

  /* Voile de fondu utilisé entre la fin du récit et son recommencement. */
  #fade {
    position: fixed; inset: 0; background: #0a0a0c; opacity: 0; pointer-events: none;
    transition: opacity 2.4s ease;
  }
  #fade.on { opacity: 1; }

  /* Textes posés sur l'image : le mode « difference » les garde lisibles
     aussi bien sur le blanc de l'aube que sur le noir de la nuit. */
  .ink { color: #fff; mix-blend-mode: difference; }

  #chapter {
    position: fixed; left: 50%; bottom: 9vh; transform: translateX(-50%);
    text-align: center; font-style: italic; letter-spacing: .32em; text-transform: lowercase;
    font-size: clamp(13px, 1.5vw, 19px); opacity: 0; transition: opacity 1.6s ease;
    pointer-events: none; white-space: nowrap;
  }
  #chapter.on { opacity: .85; }
  #chapter b { font-weight: normal; font-style: normal; letter-spacing: .5em; margin-right: .6em; }

  #intro {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: flex-start; padding-top: 13vh;
    text-align: center; transition: opacity 1.4s ease; cursor: pointer;
  }
  #intro.off { opacity: 0; pointer-events: none; }
  #intro h1 { margin: 0; font-weight: normal; font-style: italic; font-size: clamp(34px, 6.4vw, 84px); letter-spacing: .04em; }
  #intro p { margin: .6em 0 0; font-size: clamp(12px, 1.4vw, 17px); letter-spacing: .42em; text-transform: uppercase; }
  #start {
    margin-top: 5vh; padding: .8em 2.2em; font: inherit; font-size: clamp(13px, 1.4vw, 17px);
    letter-spacing: .35em; text-transform: lowercase; color: inherit; background: none;
    border: 1px solid currentColor; border-radius: 99px; cursor: pointer;
    transition: background .4s, color .4s;
  }
  #start:hover { background: #fff; color: #000; }
  #intro small { margin-top: 1.4em; font-style: italic; letter-spacing: .12em; opacity: .7; font-size: 13px; }

  #mute {
    position: fixed; right: 22px; bottom: 18px; font: inherit; font-style: italic; font-size: 14px;
    letter-spacing: .14em; background: none; border: none; cursor: pointer; opacity: .55; padding: 6px;
    transition: opacity .3s;
  }
  #mute:hover { opacity: 1; }

  #error {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    padding: 2em; text-align: center; font-style: italic; color: #222; background: #f4f4f1;
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="vignette"></div>
<div id="fade"></div>
<div id="chapter" class="ink"></div>
<div id="intro" class="ink">
  <h1>Premiers pas</h1>
  <p>le voyage d'un chaton</p>
  <button id="start">commencer</button>
  <small>avec le son, c'est encore plus doux</small>
</div>
<button id="mute" class="ink" aria-label="Activer ou couper le son">son : oui</button>
<div id="error">Impossible de charger Three.js. Une connexion internet est nécessaire au premier lancement.</div>

<!-- Three.js (module ES) depuis jsDelivr, version figée pour rester reproductible. -->
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>

<script type="module">
import * as THREE from 'three';

/* ==========================================================================
   1. OUTILS
   ========================================================================== */

const PI = Math.PI, TAU = Math.PI * 2;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
/** Interpolation douce entre deux seuils (0 avant a, 1 après b). */
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
/** Amortissement indépendant du framerate : rapproche `cur` de `target`. */
const damp = (cur, target, rate, dt) => lerp(cur, target, 1 - Math.exp(-rate * dt));
const easeInOut = t => t * t * (3 - 2 * t);
const easeOut = t => 1 - Math.pow(1 - t, 3);

/** Générateur pseudo-aléatoire à graine : le décor est identique à chaque visite. */
function seeded(seed) {
  let s = seed >>> 0;
  return () => {
    s = (s + 0x6D2B79F5) >>> 0;
    let t = Math.imul(s ^ (s >>> 15), 1 | s);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rnd = seeded(20261113);
const rand = (a = 1, b) => (b === undefined ? rnd() * a : a + rnd() * (b - a));

const params = new URLSearchParams(location.search);
const SPEED = clamp(parseFloat(params.get('speed')) || 1, 0.1, 20);
const START_SCENE = clamp(parseInt(params.get('scene')) || 1, 1, 5);

/* ==========================================================================
   2. RENDU, SCÈNE, CAMÉRA
   ========================================================================== */

const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xf4f4f1, 9, 120);   // la brume fond les plans lointains dans le ciel

const camera = new THREE.PerspectiveCamera(34, window.innerWidth / window.innerHeight, 0.1, 400);

/* ==========================================================================
   3. LE MONDE : relief, ciel, plans de collines, végétation
   Le chaton avance le long de l'axe X, sur la crête d'une longue dune.
   La caméra regarde depuis +Z ; les plans de décor s'étagent vers -Z.
   ========================================================================== */

/* Repères du récit le long du chemin (en unités de scène). */
const X_START = 0;        // là où le chaton dort
const X_BUTTERFLY = 4.5;  // rencontre avec le papillon
const X_VASE = 15.5;      // le vase sur son socle
const X_YARN = 23.3;      // la pelote, juste avant la pente
const X_MOON = 59.5;      // le promontoire final

/** Grandes ondulations du parcours : une descente, puis la montée finale. */
const pathTrend = x => -2.2 * smooth(24, 43, x) + 1.8 * smooth(46, 58, x);
/** Hauteur du chemin (z = 0) : la tendance plus de petites bosses. */
const pathHeight = x => pathTrend(x) + 0.2 * Math.sin(x * 0.21 + 2.0) + 0.08 * Math.sin(x * 0.53 + 0.7);
/** Pente du chemin (dérivée numérique). */
const pathSlope = x => (pathHeight(x + 0.05) - pathHeight(x - 0.05)) / 0.1;
/** Hauteur du sol en tout point : une crête qui retombe de part et d'autre. */
function groundHeight(x, z) {
  const d = Math.max(0, Math.abs(z) - 1.2);
  return pathHeight(x) - (z < 0 ? 0.05 : 0.02) * d * d;
}

/* --- Ciel : un dégradé plein écran dessiné derrière tout le reste --------- */
const skyMat = new THREE.ShaderMaterial({
  uniforms: { top: { value: new THREE.Color() }, bottom: { value: new THREE.Color() } },
  vertexShader: /* glsl */`
    varying vec2 vUv;
    void main() { vUv = uv; gl_Position = vec4(position.xy, 1.0, 1.0); }`,
  fragmentShader: /* glsl */`
    uniform vec3 top; uniform vec3 bottom; varying vec2 vUv;
    void main() {
      vec3 c = mix(bottom, top, smoothstep(0.3, 1.0, vUv.y));
      // léger tramage pour éviter les bandes dans le dégradé
      c += (fract(sin(dot(gl_FragCoord.xy, vec2(12.9898, 78.233))) * 43758.5453) - 0.5) / 255.0;
      gl_FragColor = vec4(c, 1.0);
      #include <colorspace_fragment>
    }`,
  depthTest: false, depthWrite: false,
});
const sky = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), skyMat);
sky.frustumCulled = false; sky.renderOrder = -10;
scene.add(sky);

/* --- Textures procédurales (dessinées dans un canvas 2D) ------------------ */
function canvasTexture(size, draw) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d'); draw(g, size);
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}
const softDot = canvasTexture(64, (g, s) => {
  const grad = g.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
  grad.addColorStop(0, 'rgba(255,255,255,1)'); grad.addColorStop(0.35, 'rgba(255,255,255,.55)');
  grad.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = grad; g.fillRect(0, 0, s, s);
});

/* --- Astre : soleil pâle le jour, grande lune la nuit --------------------- */
const astro = new THREE.Group();
const astroDisc = new THREE.Mesh(new THREE.CircleGeometry(1, 64), new THREE.MeshBasicMaterial({ color: 0xffffff, fog: false }));
const astroHalo = new THREE.Sprite(new THREE.SpriteMaterial({ map: softDot, color: 0xffffff, transparent: true, opacity: 0.35, fog: false, depthWrite: false }));
astroHalo.scale.setScalar(5.5); astroHalo.position.z = -0.5;
astro.add(astroHalo, astroDisc);
scene.add(astro);

/* --- Étoiles : visibles seulement quand la nuit tombe --------------------- */
const starsGeo = new THREE.BufferGeometry();
{
  const pos = [];
  for (let i = 0; i < 420; i++) pos.push(rand(-150, 150), rand(2, 75), -110 - rand(20));
  starsGeo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
}
const starsMat = new THREE.PointsMaterial({ color: 0xffffff, size: 2.2, sizeAttenuation: false, map: softDot, transparent: true, opacity: 0, fog: false, depthWrite: false });
const stars = new THREE.Points(starsGeo, starsMat);
stars.frustumCulled = false;
scene.add(stars);

/* --- Nuages : quelques galets flous qui dérivent --------------------------- */
const cloudMat = new THREE.MeshBasicMaterial({ color: 0xffffff, fog: false });
const clouds = [];
{
  const blob = new THREE.CircleGeometry(1, 40);
  for (let i = 0; i < 7; i++) {
    const cloud = new THREE.Group();
    const n = 3 + Math.floor(rand(3));
    for (let j = 0; j < n; j++) {
      const m = new THREE.Mesh(blob, cloudMat);
      m.scale.set(rand(3, 6.5), rand(0.7, 1.3), 1);
      m.position.set(rand(-4, 4), rand(-0.5, 0.5), j * 0.01);
      cloud.add(m);
    }
    cloud.userData = { offset: rand(-70, 70), y: rand(7, 20), speed: rand(0.15, 0.4) };
    cloud.position.z = -100;
    clouds.push(cloud); scene.add(cloud);
  }
}

/* --- Plans de collines : des silhouettes de plus en plus pâles ------------- */
const inkMat = new THREE.MeshBasicMaterial({ color: 0x2c2c2e });   // « encre » des silhouettes
const LAYERS = [
  { z: -16, base: 0.2, amp: 0.8, freq: 0.110, follow: 0.85, peaks: 0 },
  { z: -27, base: 1.3, amp: 1.3, freq: 0.071, follow: 0.6, peaks: 0 },
  { z: -42, base: 2.9, amp: 2.0, freq: 0.047, follow: 0.35, peaks: 0.5 },
  { z: -62, base: 5.0, amp: 3.2, freq: 0.031, follow: 0.15, peaks: 1 },
  { z: -90, base: 8.0, amp: 5.5, freq: 0.019, follow: 0, peaks: 1 },
];
/** Profil d'un plan : dunes arrondies au premier plan, crêtes pointues au loin. */
function layerHeight(L, i, x) {
  const p = i * 7.31;
  const round = 0.6 * Math.sin(x * L.freq + p) + 0.3 * Math.sin(x * L.freq * 2.3 + p * 1.7) + 0.1 * Math.sin(x * L.freq * 5.1 + p * 0.6);
  const sharp = 1.2 * (1 - Math.abs(Math.sin(x * L.freq * 0.9 + p))) + 0.5 * (1 - Math.abs(Math.sin(x * L.freq * 2.1 + p * 2.0))) - 0.9;
  return L.base + pathTrend(x) * L.follow + L.amp * lerp(round, sharp, L.peaks);
}
LAYERS.forEach((L, i) => {
  const x0 = -150, x1 = 220, step = 0.75, verts = [], idx = [];
  for (let x = x0, n = 0; x <= x1; x += step, n++) {
    verts.push(x, layerHeight(L, i, x), L.z, x, -60, L.z);
    if (n > 0) { const a = (n - 1) * 2; idx.push(a, a + 1, a + 2, a + 2, a + 1, a + 3); }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
  geo.setIndex(idx);
  scene.add(new THREE.Mesh(geo, inkMat));
});

/* Arbres en silhouette posés sur les deux premiers plans. */
{
  const trunk = new THREE.PlaneGeometry(1, 1), crown = new THREE.CircleGeometry(1, 28);
  for (let li = 0; li < 2; li++) {
    const L = LAYERS[li];
    for (let x = -40; x < 110; x += rand(3.5, 10)) {
      const h = rand(1.2, 2.6) * (1 + li * 0.5), y = layerHeight(L, li, x), z = L.z + 0.05;
      const t = new THREE.Mesh(trunk, inkMat); t.scale.set(0.07 * (1 + li), h, 1); t.position.set(x, y + h / 2 - 0.1, z);
      const c = new THREE.Mesh(crown, inkMat); c.scale.set(h * rand(0.28, 0.4), h * rand(0.42, 0.6), 1); c.position.set(x, y + h, z);
      scene.add(t, c);
    }
  }
}

/* --- Sol : la dune sur laquelle marche le chaton --------------------------- */
const groundMat = new THREE.MeshBasicMaterial({ color: 0xf6f6f3, vertexColors: true });
const groundGeo = new THREE.PlaneGeometry(160, 28, 320, 28);
groundGeo.rotateX(-PI / 2);
groundGeo.translate(35, 0, -2);
{
  const pos = groundGeo.attributes.position, col = new Float32Array(pos.count * 3);
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), z = pos.getZ(i);
    pos.setY(i, groundHeight(x, z));
    // la dune s'assombrit doucement en s'éloignant de la crête : cela lui donne du volume
    const shade = 1 - 0.3 * smooth(1.0, 11, Math.abs(z)) - 0.04 * Math.sin(x * 0.9 + z * 1.3);
    col[i * 3] = col[i * 3 + 1] = col[i * 3 + 2] = shade;
  }
  groundGeo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  groundGeo.computeVertexNormals();
}
const ground = new THREE.Mesh(groundGeo, groundMat);
scene.add(ground);
/* Même géométrie, mais ne dessine que les ombres portées (teinte du sol maîtrisée). */
const shadowMat = new THREE.ShadowMaterial({ opacity: 0.3 });
const groundShadow = new THREE.Mesh(groundGeo, shadowMat);
groundShadow.receiveShadow = true; groundShadow.position.y = 0.003;
scene.add(groundShadow);

/* --- Végétation : touffes d'herbe, arbres boules et galets ----------------- */
const nearMat = new THREE.MeshBasicMaterial({ color: 0x141416 });    // silhouettes proches
/* Zones où se jouent les scènes : on n'y plante rien devant la caméra. */
const STAGES = [[-2.5, 9.5], [13.5, 18.5], [21.5, 26], [40, 48.5], [56.5, 64]];
const onStage = x => STAGES.some(([a, b]) => x > a && x < b);
const tufts = [];
{
  const blade = new THREE.ConeGeometry(0.022, 1, 5); blade.translate(0, 0.5, 0);
  const addTuft = (x, z, scale) => {
    const tuft = new THREE.Group();
    const n = 4 + Math.floor(rand(4));
    for (let i = 0; i < n; i++) {
      const b = new THREE.Mesh(blade, nearMat);
      b.scale.set(scale, rand(0.25, 0.6) * scale, scale);
      b.rotation.set(rand(-0.35, 0.35), 0, rand(-0.5, 0.5));
      b.position.x = rand(-0.08, 0.08) * scale;
      tuft.add(b);
    }
    tuft.position.set(x, groundHeight(x, z) - 0.02, z);
    tuft.userData.phase = rand(TAU);
    tufts.push(tuft); scene.add(tuft);
  };
  for (let x = -18; x < 82; x += rand(0.5, 1.6)) addTuft(x, rand(-7, -1.3), rand(0.7, 1.5));
  for (let x = -18; x < 82; x += rand(1.2, 3.5)) if (!onStage(x)) addTuft(x, rand(1.5, 3.2), rand(0.9, 1.6));

  // Arbres « sucette », en retrait derrière le chemin.
  const trunkGeo = new THREE.CylinderGeometry(0.035, 0.06, 1, 8); trunkGeo.translate(0, 0.5, 0);
  const ballGeo = new THREE.SphereGeometry(1, 24, 18);
  for (let x = -16; x < 84; x += rand(6, 13)) {
    const z = rand(-10, -4.5), h = rand(1.1, 2.0), tree = new THREE.Group();
    const trunk = new THREE.Mesh(trunkGeo, nearMat); trunk.scale.y = h; trunk.castShadow = true;
    const crown = new THREE.Mesh(ballGeo, nearMat); crown.scale.set(h * 0.3, h * 0.42, h * 0.3); crown.position.y = h; crown.castShadow = true;
    tree.add(trunk, crown);
    tree.position.set(x, groundHeight(x, z) - 0.05, z);
    scene.add(tree);
  }
  // Galets ronds.
  for (let i = 0; i < 26; i++) {
    const x = rand(-16, 80), z = rand() < 0.75 ? rand(-6, -1.4) : rand(1.6, 3), r = rand(0.07, 0.22);
    if (z > 0 && onStage(x)) continue;
    const rock = new THREE.Mesh(ballGeo, nearMat); rock.scale.set(r * 1.4, r * 0.8, r);
    rock.position.set(x, groundHeight(x, z) + r * 0.3, z); rock.castShadow = true;
    scene.add(rock);
  }
}

/* --- Poussières portées par le vent ---------------------------------------- */
const MOTES = 140, motesGeo = new THREE.BufferGeometry();
const motePos = new Float32Array(MOTES * 3), moteSeed = [];
for (let i = 0; i < MOTES; i++) moteSeed.push({ x: rand(-12, 12), y: rand(-1, 5), z: rand(-8, 4), s: rand(0.3, 1), p: rand(TAU) });
motesGeo.setAttribute('position', new THREE.BufferAttribute(motePos, 3));
const motesMat = new THREE.PointsMaterial({ color: 0x222224, size: 0.05, map: softDot, transparent: true, opacity: 0.5, depthWrite: false });
const motes = new THREE.Points(motesGeo, motesMat);
motes.frustumCulled = false;
scene.add(motes);

/* --- Lumières --------------------------------------------------------------- */
const hemi = new THREE.HemisphereLight(0xffffff, 0x8a8a8a, 1.2);
const keyLight = new THREE.DirectionalLight(0xffffff, 2.6);   // contre-jour : dessine le contour du chaton
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
Object.assign(keyLight.shadow.camera, { left: -7, right: 7, top: 7, bottom: -7, near: 0.5, far: 30 });
keyLight.shadow.bias = -0.0005; keyLight.shadow.radius = 5;
const fillLight = new THREE.DirectionalLight(0xffffff, 0.7);  // débouche le visage côté caméra
scene.add(hemi, keyLight, keyLight.target, fillLight, fillLight.target);

/* ==========================================================================
   4. HEURE DU JOUR : une seule valeur (0 = aube, 1 = nuit) pilote la palette
   ========================================================================== */

const PALETTE = [
  //  t     haut du ciel  horizon   brume     encre     proche    sol       nuages  étoiles  clé   ambiance
  { t: 0.00, top: 0xcdcdca, bot: 0xfafaf7, fog: 0xf2f2ef, ink: 0x8a8a8a, near: 0x1a1a1c, ground: 0xfcfcf9, cloud: 0.75, stars: 0, key: 2.4, hemi: 1.25 },
  { t: 0.40, top: 0xdededb, bot: 0xffffff, fog: 0xf8f8f6, ink: 0x707072, near: 0x151517, ground: 0xf7f7f4, cloud: 0.85, stars: 0, key: 2.8, hemi: 1.35 },
  { t: 0.74, top: 0x707072, bot: 0xcacac8, fog: 0xbcbcba, ink: 0x2a2a2c, near: 0x0b0b0c, ground: 0xb4b4b2, cloud: 0.35, stars: 0.15, key: 2.4, hemi: 0.95 },
  { t: 1.00, top: 0x09090b, bot: 0x35353a, fog: 0x2d2d31, ink: 0x060607, near: 0x020203, ground: 0x66666b, cloud: 0.08, stars: 1, key: 3.4, hemi: 0.55 },
];
const world = { tod: 0, todGoal: 0, todRate: 0.2, moon: 0 };   // moon : 0 = soleil, 1 = lune levée
const _c1 = new THREE.Color(), _c2 = new THREE.Color();
const mixHex = (target, a, b, k) => target.copy(_c1.setHex(a)).lerp(_c2.setHex(b), k);

function applyPalette() {
  let i = 0;
  while (i < PALETTE.length - 2 && world.tod > PALETTE[i + 1].t) i++;
  const A = PALETTE[i], B = PALETTE[i + 1], k = clamp((world.tod - A.t) / (B.t - A.t), 0, 1);
  mixHex(skyMat.uniforms.top.value, A.top, B.top, k);
  mixHex(skyMat.uniforms.bottom.value, A.bot, B.bot, k);
  mixHex(scene.fog.color, A.fog, B.fog, k);
  mixHex(inkMat.color, A.ink, B.ink, k);
  mixHex(nearMat.color, A.near, B.near, k);
  mixHex(groundMat.color, A.ground, B.ground, k);
  // Nuages : un blanc plus ou moins fondu dans la teinte du ciel.
  cloudMat.color.copy(skyMat.uniforms.top.value).lerp(_c1.setHex(0xffffff), lerp(A.cloud, B.cloud, k));
  starsMat.opacity = lerp(A.stars, B.stars, k);
  keyLight.intensity = lerp(A.key, B.key, k);
  hemi.intensity = lerp(A.hemi, B.hemi, k);
  // Les poussières passent du sombre (sur fond clair) au clair (sur fond de nuit).
  motesMat.color.setScalar(smooth(0.6, 0.9, world.tod) * 0.9 + 0.1);
}

/* ==========================================================================
   5. CAMÉRA : suit le chaton, avec de légers travellings et un parallaxe souris
   ========================================================================== */

/* Réglages courants et réglages visés ; le récit ne modifie que `camGoal`. */
const cam = { dist: 4.4, height: 0.55, az: 0.35, ahead: 0, lift: 0.4 };
const camGoal = { ...cam };
let camRate = 0.8;
const camTarget = new THREE.Vector3(X_START, pathHeight(X_START) + 0.4, 0);
const mouse = { x: 0, y: 0, sx: 0, sy: 0 };   // position brute et position lissée (-1..1)

window.addEventListener('pointermove', e => {
  mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouse.y = (e.clientY / window.innerHeight) * 2 - 1;
});

/** Point que la caméra suit : remplacé plus bas par la position du chaton. */
let focus = { x: X_START, y: pathHeight(X_START) };

function updateCamera(dt, t, snap = false) {
  const r = snap ? 1 : 0;
  for (const k in cam) cam[k] = r ? camGoal[k] : damp(cam[k], camGoal[k], camRate, dt);
  mouse.sx = damp(mouse.sx, mouse.x, 2.5, dt);
  mouse.sy = damp(mouse.sy, mouse.y, 2.5, dt);

  // La cible glisse vers le chaton avec un peu de retard : c'est le travelling.
  const tx = focus.x + cam.ahead, ty = focus.y + cam.lift;
  camTarget.x = r ? tx : damp(camTarget.x, tx, 2.2, dt);
  camTarget.y = r ? ty : damp(camTarget.y, ty, 1.8, dt);

  // En format portrait on recule pour garder le chaton et son décor dans le cadre.
  const d = cam.dist * clamp(1.45 / camera.aspect, 1, 2.3);
  // Lente respiration de l'angle + parallaxe doux piloté par la souris.
  const az = cam.az + Math.sin(t * 0.11) * 0.05 + mouse.sx * 0.11;
  camera.position.set(
    camTarget.x + Math.sin(az) * d + mouse.sx * 0.3,
    camTarget.y + cam.height + Math.sin(t * 0.17) * 0.05 - mouse.sy * 0.28,
    Math.cos(az) * d);
  camera.lookAt(camTarget.x - mouse.sx * 0.12, camTarget.y + mouse.sy * 0.06, 0);
  camera.rotation.z += Math.sin(t * 0.13) * 0.004 + mouse.sx * 0.005;
}

/* ==========================================================================
   6. MISE À JOUR DU DÉCOR
   ========================================================================== */

function updateWorld(dt, t) {
  world.tod = damp(world.tod, world.todGoal, world.todRate, dt);
  applyPalette();

  // L'astre et les étoiles suivent la caméra : ils semblent infiniment loin.
  const cx = camera.position.x;
  const sunY = lerp(17, -8, smooth(0.1, 0.8, world.tod));      // le soleil descend au fil du jour
  const moonY = lerp(-12, 13, easeInOut(world.moon));          // la lune se lève à la fin
  const isMoon = world.moon > 0.01;
  astro.position.set(cx * 0.96 + (isMoon ? 9 : -16), (isMoon ? moonY : sunY) + camTarget.y * 0.5, -105);
  astro.scale.setScalar(isMoon ? 7.5 : 3.2);
  stars.position.x = cx * 0.98;
  starsMat.size = 2.2 + Math.sin(t * 1.3) * 0.25;

  for (const c of clouds) {
    const u = c.userData;
    u.offset -= u.speed * dt; if (u.offset < -90) u.offset += 180;
    c.position.x = cx * 0.94 + u.offset; c.position.y = u.y + camTarget.y * 0.4;
  }

  // L'herbe ondule sous le vent.
  for (const tuft of tufts) tuft.rotation.z = Math.sin(t * 1.4 + tuft.userData.phase + tuft.position.x * 0.4) * 0.12 - 0.05;

  // Les poussières dérivent dans un volume qui se replie autour de la caméra.
  const wrap = (v, half) => ((v % (2 * half)) + 3 * half) % (2 * half) - half;
  for (let i = 0; i < MOTES; i++) {
    const m = moteSeed[i];
    motePos[i * 3] = camTarget.x + wrap(m.x - t * 0.5 * m.s - camTarget.x, 12);
    motePos[i * 3 + 1] = camTarget.y + m.y + Math.sin(t * 0.6 * m.s + m.p) * 0.35;
    motePos[i * 3 + 2] = m.z;
  }
  motesGeo.attributes.position.needsUpdate = true;

  // La lumière clé accompagne le chaton pour que son ombre reste nette.
  const lx = lerp(-3, 3.5, world.moon);
  keyLight.position.set(focus.x + lx, focus.y + 6, -4.5);
  keyLight.target.position.set(focus.x, focus.y, 0);
  fillLight.position.set(focus.x + 2, focus.y + 3, 8);
  fillLight.target.position.set(focus.x, focus.y, 0);
}

/* ==========================================================================
   7. LE CHATON
   Modelé uniquement avec des volumes lisses (sphères, capsules, révolutions)
   pour un rendu rond « à la Pixar ». Repère local : +Z = devant, +Y = haut.
   La caméra voit donc son flanc droit (-X local) quand il marche vers +X.
   ========================================================================== */

const LEG = 0.315;   // longueur d'une patte, du pivot de la hanche jusqu'au sol

function createKitten() {
  /* --- Matières --- */
  // Pelage noir : le « sheen » dépose un liseré velouté sur les contours.
  const fur = new THREE.MeshPhysicalMaterial({ color: 0x0b0b0d, roughness: 0.82, sheen: 1, sheenRoughness: 0.5, sheenColor: new THREE.Color(0xb4b4bc) });
  const earInner = new THREE.MeshStandardMaterial({ color: 0x34343a, roughness: 0.85 });
  const white = new THREE.MeshStandardMaterial({ color: 0xf7f7f4, roughness: 0.7 });
  const eyeMat = new THREE.MeshStandardMaterial({ color: 0xfbfbf8, roughness: 0.2, emissive: 0xffffff, emissiveIntensity: 0.12 });
  const black = new THREE.MeshBasicMaterial({ color: 0x000000 });
  const glintMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
  const noseMat = new THREE.MeshStandardMaterial({ color: 0x060606, roughness: 0.25 });

  const unit = new THREE.SphereGeometry(1, 40, 28);
  /** Ajoute une sphère étirée (ellipsoïde) à `parent`. */
  const blob = (parent, mat, sx, sy, sz, x = 0, y = 0, z = 0, shadow = true) => {
    const m = new THREE.Mesh(unit, mat);
    m.scale.set(sx, sy, sz); m.position.set(x, y, z); m.castShadow = shadow;
    parent.add(m); return m;
  };

  /* --- Hiérarchie : racine > inclinaison (pente) > cap > bassin --- */
  const root = new THREE.Group(), tilt = new THREE.Group(), yawG = new THREE.Group(), hips = new THREE.Group();
  root.add(tilt); tilt.add(yawG); yawG.add(hips);

  /* --- Corps : trois volumes qui se fondent --- */
  const body = blob(hips, fur, 0.2, 0.195, 0.34);
  blob(hips, fur, 0.192, 0.19, 0.19, 0, 0.012, 0.15);    // poitrail
  blob(hips, fur, 0.195, 0.188, 0.19, 0, 0, -0.14);        // croupe

  /* --- Tête : grosse et ronde, comme chez tous les chatons --- */
  const neck = new THREE.Group(); neck.position.set(0, 0.17, 0.27); hips.add(neck);
  const head = new THREE.Group(); head.rotation.order = 'YXZ'; neck.add(head);
  blob(head, fur, 0.25, 0.22, 0.225, 0, 0.07, 0.06);     // crâne
  blob(head, fur, 0.1, 0.09, 0.1, 0.14, -0.01, 0.1);     // joues rebondies
  blob(head, fur, 0.1, 0.09, 0.1, -0.14, -0.01, 0.1);

  // La tache blanche du museau : deux babines, un menton.
  blob(head, white, 0.062, 0.05, 0.05, 0.038, -0.035, 0.262, false);
  blob(head, white, 0.062, 0.05, 0.05, -0.038, -0.035, 0.262, false);
  blob(head, white, 0.045, 0.036, 0.04, 0, -0.072, 0.25, false);
  const nose = blob(head, noseMat, 0.023, 0.015, 0.014, 0, -0.01, 0.314, false);
  const mouth = blob(head, black, 0.016, 0.004, 0.02, 0, -0.064, 0.297, false);

  // Moustaches : de fins traits blancs.
  const whiskerGeo = new THREE.CylinderGeometry(0.0022, 0.0008, 0.2, 5); whiskerGeo.translate(0, 0.1, 0);
  for (const s of [1, -1]) for (let i = -1; i <= 1; i++) {
    const w = new THREE.Mesh(whiskerGeo, glintMat);
    w.position.set(s * 0.075, -0.035 + i * 0.012, 0.275);
    w.rotation.set(0.25, 0, -s * (PI / 2 - 0.12) + s * i * 0.24);
    head.add(w);
  }

  // Yeux : grand globe clair, pupille ronde, petit reflet.
  const eyes = [];
  for (const s of [1, -1]) {
    const eye = new THREE.Group(); eye.position.set(s * 0.1, 0.085, 0.248); eye.rotation.y = s * 0.28;
    blob(eye, eyeMat, 0.068, 0.076, 0.04, 0, 0, 0, false);
    const pupil = blob(eye, black, 0.04, 0.05, 0.012, 0, 0, 0.034, false);
    blob(eye, glintMat, 0.013, 0.013, 0.006, 0.018, 0.026, 0.046, false);
    head.add(eye); eyes.push({ eye, pupil, side: s });
  }

  // Oreilles : cônes à pointe arrondie (géométrie de révolution).
  const earPts = [];
  for (let i = 0; i <= 12; i++) { const k = i / 12; earPts.push(new THREE.Vector2(0.1 * Math.sqrt(1 - Math.pow(k, 1.7)) + 0.0001, 0.2 * k)); }
  const earGeo = new THREE.LatheGeometry(earPts, 24);
  const ears = [];
  for (const s of [1, -1]) {
    const ear = new THREE.Group(); ear.position.set(s * 0.135, 0.215, 0.04);
    const outer = new THREE.Mesh(earGeo, fur); outer.scale.set(1, 1, 0.55); outer.castShadow = true;
    const inner = new THREE.Mesh(earGeo, earInner); inner.scale.set(0.68, 0.74, 0.3); inner.position.set(0, 0.012, 0.035);
    ear.add(outer, inner); head.add(ear); ears.push({ ear, side: s, flick: 0 });
  }

  /* --- Pattes : une capsule et un coussinet, pivot à la hanche --- */
  const legGeo = new THREE.CapsuleGeometry(0.064, 0.15, 6, 16); legGeo.translate(0, -0.135, 0);
  const legs = [];
  // Ordre : avant côté caméra, avant côté opposé, arrière côté caméra, arrière côté opposé.
  for (const [x, z] of [[-0.11, 0.2], [0.11, 0.2], [-0.12, -0.2], [0.12, -0.2]]) {
    const leg = new THREE.Group(); leg.position.set(x, -0.045, z);
    const m = new THREE.Mesh(legGeo, fur); m.castShadow = true; leg.add(m);
    blob(leg, fur, 0.07, 0.046, 0.086, 0, -0.269, 0.026);
    hips.add(leg); legs.push(leg);
  }

  /* --- Queue : une chaîne d'articulations habillée d'un tube lisse ---
     Les articulations ne portent aucun maillage : à chaque image, on tend
     autour d'elles un tube (anneaux de sommets) terminé par un bout arrondi. */
  const tail = [];
  let parent = hips;
  const TAIL = 18, RAD = 12, CAP = 4, RINGS = TAIL + CAP;
  for (let i = 0; i < TAIL; i++) {
    const joint = new THREE.Group();
    joint.position.set(0, i ? 0.033 : 0.09, i ? 0 : -0.3);
    parent.add(joint); tail.push({ joint, r: lerp(0.047, 0.034, i / (TAIL - 1)) }); parent = joint;
  }
  const tailGeo = new THREE.BufferGeometry();
  const tailPos = new Float32Array(RINGS * RAD * 3), tailNor = new Float32Array(RINGS * RAD * 3), tailIdx = [];
  for (let r = 0; r < RINGS - 1; r++) for (let j = 0; j < RAD; j++) {
    const a = r * RAD + j, b = r * RAD + (j + 1) % RAD, c = a + RAD, d = b + RAD;
    tailIdx.push(a, c, b, b, c, d);
  }
  tailGeo.setAttribute('position', new THREE.BufferAttribute(tailPos, 3));
  tailGeo.setAttribute('normal', new THREE.BufferAttribute(tailNor, 3));
  tailGeo.setIndex(tailIdx);
  const tailMesh = new THREE.Mesh(tailGeo, fur);
  tailMesh.castShadow = true; tailMesh.frustumCulled = false;
  root.userData.tailMesh = tailMesh;     // ajouté à la scène : ses sommets sont en coordonnées monde
  const _c = new THREE.Vector3(), _q = new THREE.Vector3();
  function skinTail(fluff) {
    root.updateMatrixWorld(true);
    for (let r = 0; r < RINGS; r++) {
      const i = Math.min(r, TAIL - 1), m = tail[i].joint.matrixWorld;
      const th = r < TAIL ? 0 : (r - TAIL + 1) / CAP * PI / 2;      // anneaux du bout : une demi-sphère
      const rad = tail[i].r * (1 + 0.9 * fluff), ring = rad * Math.cos(th), up = rad * Math.sin(th);
      _c.set(0, 0, 0).applyMatrix4(m);
      for (let j = 0; j < RAD; j++) {
        const a = j / RAD * TAU, o = (r * RAD + j) * 3;
        _q.set(ring * Math.cos(a), up, ring * Math.sin(a)).applyMatrix4(m);
        tailPos[o] = _q.x; tailPos[o + 1] = _q.y; tailPos[o + 2] = _q.z;
        _q.sub(_c).normalize();
        tailNor[o] = _q.x; tailNor[o + 1] = _q.y; tailNor[o + 2] = _q.z;
      }
    }
    tailGeo.attributes.position.needsUpdate = true; tailGeo.attributes.normal.needsUpdate = true;
  }

  /* --- Canaux d'animation --------------------------------------------------
     `g` contient les valeurs visées par le récit, `p` les valeurs courantes
     qui les rejoignent en douceur : toutes les poses se mélangent ainsi
     naturellement, sans clé d'animation. */
  const defaults = {
    yaw: PI / 2,                       // cap (PI/2 = face à +X, 0 = face à la caméra)
    z: 0, jump: 0,                     // écart latéral, hauteur de saut
    sit: 0, lie: 0, crouch: 0, stretch: 0, tuck: 0, air: 0,   // poses du corps (0..1)
    roll: 0, spin: 0, squash: 1,       // tonneau, culbute, écrasement
    headYaw: 0, headPitch: 0, headRoll: 0,
    eyeOpen: 1, pupil: 1, gazeX: 0, gazeY: 0, cross: 0,       // regard (cross = loucher)
    earBack: 0, mouth: 0,
    tailUp: 0.4, tailWag: 0.3, tailWrap: 0, tailFluff: 0,
    paw: 0, wiggle: 0, run: 0,
  };
  const K = {
    root, hips, head, nose, x: 0, prevX: 0, phase: 0, move: 0,
    p: { ...defaults }, g: { ...defaults }, defaults,
    rate: 7, lookTarget: null, lid: 1, blink: 0, blinkT: 2, flickT: 3, onStep: null,
  };
  /** Fixe des poses visées (transition douce). */
  K.set = o => Object.assign(K.g, o);
  /** Impose des valeurs immédiatement, sans transition. */
  K.snap = o => { Object.assign(K.g, o); Object.assign(K.p, o); };
  /** Revient à la pose neutre (debout), en gardant position et cap. */
  K.neutral = (extra = {}) => K.set({ ...defaults, yaw: K.g.yaw, z: K.g.z, ...extra });

  const _v = new THREE.Vector3();
  K.nosePosition = out => nose.getWorldPosition(out);

  K.update = (dt, t) => {
    const p = K.p, g = K.g;

    /* Suivi du regard : la tête se tourne vers un point du monde. */
    if (K.lookTarget) {
      yawG.worldToLocal(_v.copy(K.lookTarget));
      _v.y -= hips.position.y + 0.26; _v.z -= 0.22;
      g.headYaw = clamp(Math.atan2(_v.x, _v.z), -1.3, 1.3);
      g.headPitch = clamp(-Math.atan2(_v.y, Math.hypot(_v.x, _v.z)), -0.8, 0.7);
    }
    for (const k in g) p[k] = damp(p[k], g[k], K.rate, dt);

    /* Déplacement : la phase de marche avance avec la distance parcourue. */
    const dx = K.x - K.prevX; K.prevX = K.x;
    const speed = dt > 0 ? Math.abs(dx) / dt : 0;
    const grounded = p.jump < 0.03 && p.tuck < 0.3;
    K.move = damp(K.move, speed > 0.08 && grounded ? 1 : 0, 9, dt);
    const before = Math.floor(K.phase / PI);
    K.phase += Math.abs(dx) / lerp(0.5, 1.2, p.run) * TAU;
    if (K.onStep && K.move > 0.5 && Math.floor(K.phase / PI) !== before) K.onStep(p.run);

    root.position.set(K.x, groundHeight(K.x, p.z) + p.jump, p.z);
    tilt.rotation.z = Math.atan(pathSlope(K.x)) * 0.8 * (1 - p.lie * 0.6);
    yawG.rotation.y = p.yaw;

    /* Bassin : hauteur et tangage selon la pose, plus le rebond de l'allure. */
    let hipY = 0.36 - 0.01 * p.sit - 0.09 * p.crouch - 0.04 * p.stretch;
    let pitch = -0.62 * p.sit + 0.22 * p.crouch + 0.4 * p.stretch;      // négatif = nez vers le haut
    hipY = lerp(hipY, 0.175, p.lie); pitch *= 1 - p.lie;
    hipY = lerp(hipY, 0.23, Math.max(p.tuck, p.air));
    hipY += lerp(Math.abs(Math.sin(K.phase)) * 0.018, Math.max(0, Math.sin(K.phase + 0.6)) * 0.1, p.run) * K.move;
    pitch += Math.sin(K.phase + 1.2) * 0.13 * p.run * K.move;            // tangage du galop
    const wig = Math.sin(t * 15) * p.wiggle;                             // dandinement avant le bond
    hips.position.set(-wig * 0.012, hipY * lerp(1, p.squash, 0.7) + Math.sin(t * 2.1) * 0.004, 0);
    hips.rotation.set(pitch + p.spin, wig * 0.17, p.roll + 0.22 * p.lie);
    const sq = p.squash, inv = 1 / Math.sqrt(sq);
    hips.scale.set(inv, sq, inv);
    const breath = 1 + Math.sin(t * lerp(2.4, 1.3, p.lie)) * 0.022;
    body.scale.set(0.2 * breath, 0.195 * breath, 0.34);

    /* Pattes : chaque patte reçoit un angle « monde » puis s'allonge juste
       assez pour toucher le sol (une cinématique inverse très simplifiée). */
    for (let i = 0; i < 4; i++) {
      const front = i < 2, leg = legs[i];
      const phW = K.phase + (i === 0 || i === 3 ? 0 : PI);                 // pas : diagonales alternées
      const phR = K.phase + (front ? 0 : PI * 0.85) + (i % 2) * 0.45;      // galop : avant puis arrière
      let a = lerp(Math.sin(phW) * 0.5, Math.sin(phR) * 0.95, p.run) * K.move;
      const lift = lerp(Math.max(0, -Math.cos(phW)), Math.max(0, -Math.cos(phR)), p.run) * K.move;
      let plant = 1, len = 1;
      a += front ? -0.3 * p.crouch - 0.95 * p.stretch : 0.15 * p.stretch;
      if (!front) { a = lerp(a, -1.3, p.sit); plant *= 1 - p.sit; len = lerp(len, 0.9, p.sit); }   // assis : pattes arrière repliées
      a = lerp(a, front ? -1.35 : -1.25, p.lie); plant *= 1 - p.lie; len = lerp(len, 0.55, p.lie);
      a = lerp(a, front ? 0.7 : -0.7, p.tuck); plant *= 1 - p.tuck; len = lerp(len, 0.6, p.tuck);   // en boule
      a = lerp(a, Math.sin(t * 10 + i * 1.9) * 0.55 + (front ? -0.3 : 0.3), p.air); plant *= 1 - p.air;   // sur le dos, pattes en l'air
      if (i === 0) { a = lerp(a, -1.45, p.paw); plant *= 1 - p.paw; len = lerp(len, 1.15, p.paw); }  // patte tendue
      const flying = clamp(p.jump * 5, 0, 1) * (1 - p.tuck) * (1 - p.air);
      a = lerp(a, front ? -0.85 : 0.85, flying); plant *= 1 - flying;      // en plein saut : pattes écartées
      const pivotY = hipY + leg.position.y * Math.cos(pitch) - leg.position.z * Math.sin(pitch);
      const planted = clamp(pivotY / Math.max(0.4, Math.cos(a)) / LEG, 0.5, 1.45);
      leg.rotation.x = a - pitch;
      leg.scale.y = lerp(len, planted, plant) * (1 - lift * 0.28);
    }

    /* Tête : compense le tangage du corps pour rester à l'horizontale. */
    neck.position.y = 0.17 - 0.1 * p.lie;
    neck.rotation.x = -pitch * 0.92;
    const bob = Math.sin(K.phase * 2 + 0.5) * 0.025 * K.move;
    head.rotation.set(p.headPitch + bob + 0.05 * p.lie, p.headYaw, p.headRoll);

    /* Yeux : clignements spontanés, pupilles, regard (qui suit un peu la souris). */
    K.blinkT -= dt;
    if (K.blinkT < 0) { K.blink = 0.13; K.blinkT = 1.6 + Math.random() * 3.6; }
    K.blink = Math.max(0, K.blink - dt);
    K.lid = damp(K.lid, K.blink > 0 ? 0.06 : 1, 38, dt);
    const open = Math.max(0.055, p.eyeOpen * K.lid);
    const gx = p.gazeX + mouse.sx * Math.cos(p.yaw + p.headYaw) * 0.5, gy = p.gazeY - mouse.sy * 0.35;
    for (const e of eyes) {
      e.eye.scale.y = open;
      e.eye.rotation.z = -e.side * 0.3 * (1 - open);   // paupière close : un petit arc paisible
      e.pupil.scale.set(0.04 * p.pupil, 0.05 * p.pupil, 0.012);
      e.pupil.position.x = clamp(gx * 0.022 - e.side * p.cross * 0.03, -0.032, 0.032);
      e.pupil.position.y = clamp(gy * 0.02, -0.026, 0.026);
    }
    eyeMat.emissiveIntensity = 0.12 + 0.6 * smooth(0.6, 1, world.tod);   // les yeux luisent la nuit

    /* Oreilles : se couchent sous l'émotion, tressaillent de temps en temps. */
    K.flickT -= dt;
    if (K.flickT < 0) { ears[Math.random() < 0.5 ? 0 : 1].flick = 1; K.flickT = 2 + Math.random() * 5; }
    for (const e of ears) {
      e.flick = Math.max(0, e.flick - dt * 4.5);
      const f = Math.sin(e.flick * PI * 2) * e.flick * 0.35;
      e.ear.rotation.set(-0.75 * p.earBack, 0, -e.side * (0.3 + 0.4 * p.earBack + f));
    }
    mouth.scale.set(0.016 + 0.008 * p.mouth, 0.004 + 0.034 * p.mouth, 0.02);

    /* Queue : une onde parcourt la chaîne d'articulations. */
    tail[0].joint.rotation.x = lerp(-2.0, -0.35, (p.tailUp + 1) / 2) - pitch * 0.8;
    for (let i = 1; i < tail.length; i++) {
      const j = tail[i].joint;
      j.rotation.x = 0.068 * p.tailUp + Math.sin(t * 2.2 - i * 0.37) * 0.05 * (1 - p.lie);
      j.rotation.z = Math.sin(t * (1.6 + 4 * p.wiggle) - i * 0.33) * p.tailWag * 0.15 + p.tailWrap * 0.2;
    }
    skinTail(p.tailFluff);   // tailFluff : la queue en écouvillon des grandes frayeurs
  };
  return K;
}

const K = createKitten();
scene.add(K.root, K.root.userData.tailMesh);

/* [SUITE] */

/* ==========================================================================
   BOUCLE PRINCIPALE ET REDIMENSIONNEMENT
   ========================================================================== */

let time = 0;
/** Avance toute la simulation de `dt` secondes. */
function step(dt) {
  time += dt;
  K.update(dt, time);
  focus.x = K.x; focus.y = groundHeight(K.x, K.p.z) + K.p.jump * 0.35;
  updateCamera(dt, time);
  updateWorld(dt, time);
}

function onResize() {
  const w = window.innerWidth, h = window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(w, h);
}
window.addEventListener('resize', onResize);

const clock = new THREE.Clock();
updateCamera(0, 0, true);
renderer.setAnimationLoop(() => {
  // dt borné : un onglet resté en arrière-plan ne provoque pas de saut.
  step(Math.min(clock.getDelta(), 0.05) * SPEED);
  renderer.render(scene, camera);
});

/* Petit accès de mise au point (console) : avancer le temps sans attendre. */
window.__debug = { step, world, cam, camGoal, K, render: () => renderer.render(scene, camera) };
</script>
<script>
  /* Si le module n'a pas pu se charger (pas de réseau), on l'explique. */
  window.addEventListener('load', () => setTimeout(() => {
    if (!window.__debug) document.getElementById('error').style.display = 'flex';
  }, 4000));
</script>
</body>
</html>
