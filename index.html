<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Premiers pas — le voyage d'un chaton</title>
<!--
  PREMIERS PAS
  Motion design 3D interactif et autonome : un chaton noir (une tache blanche
  sur le museau) découvre le monde, de l'aube à la nuit.

  - Un seul fichier : HTML + CSS + JavaScript. Three.js est chargé depuis un CDN.
  - Aucun asset externe : géométries, textures et sons sont générés par le code.
  - Le chaton est noir et blanc ; le décor, lui, change de couleurs au fil de
    la journée (aube rosée, jour turquoise, crépuscule orangé, nuit bleue).
    Deux accents sont réservés aux événements : corail (papillon, cœurs) et or (lucioles).

  Paramètres d'URL facultatifs (pratiques pour régler une scène) :
    ?scene=2   démarre directement à la scène indiquée (1 à 5)
    ?speed=3   multiplie la vitesse du récit
-->
<style>
  :root { --serif: "Cormorant Garamond", "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #f6cdbd; }
  body { font-family: var(--serif); -webkit-font-smoothing: antialiased; }

  /* Le canvas WebGL occupe toute la fenêtre. */
  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  /* Vignette très légère pour refermer le cadre. */
  #vignette {
    position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(0, 0, 0, .16) 100%);
  }

  /* Voile de fondu utilisé entre la fin du récit et son recommencement. */
  #fade {
    position: fixed; inset: 0; background: #0a0a0c; opacity: 0; pointer-events: none;
    transition: opacity 2.4s ease;
  }
  #fade.on { opacity: 1; }

  /* Textes posés sur l'image : le mode « difference » les garde lisibles
     aussi bien sur le blanc de l'aube que sur le noir de la nuit. */
  .ink { color: #fff; text-shadow: 0 1px 14px rgba(20, 20, 50, .45), 0 0 2px rgba(20, 20, 50, .35); }

  #intro {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: flex-start; padding-top: 13vh;
    text-align: center; transition: opacity 1.4s ease; cursor: pointer;
  }
  #intro.off { opacity: 0; pointer-events: none; }
  #intro h1 { margin: 0; font-weight: normal; font-style: italic; font-size: clamp(34px, 6.4vw, 84px); letter-spacing: .04em; }
  #intro p { margin: .6em 0 0; font-size: clamp(12px, 1.4vw, 17px); letter-spacing: .42em; text-transform: uppercase; }
  #start {
    margin-top: 5vh; padding: .8em 2.2em; font: inherit; font-size: clamp(13px, 1.4vw, 17px);
    letter-spacing: .35em; text-transform: lowercase; color: inherit; background: none;
    border: 1px solid currentColor; border-radius: 99px; cursor: pointer;
    transition: background .4s, color .4s;
  }
  #start:hover { background: #fff; color: #3b2a45; text-shadow: none; }
  #intro small { margin-top: 1.4em; font-style: italic; letter-spacing: .12em; opacity: .7; font-size: 13px; }

  #mute {
    position: fixed; right: 22px; bottom: 18px; font: inherit; font-style: italic; font-size: 14px;
    letter-spacing: .14em; background: none; border: none; cursor: pointer; opacity: .55; padding: 6px;
    transition: opacity .3s;
  }
  #mute:hover { opacity: 1; }

  #pause {
    position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); display: none;
    font-style: italic; letter-spacing: .32em; font-size: clamp(14px, 1.6vw, 20px);
    pointer-events: none; white-space: nowrap;
  }
  #pause.on { display: block; }

  #error {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    padding: 2em; text-align: center; font-style: italic; color: #222; background: #f4f4f1;
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="vignette"></div>
<div id="fade"></div>
<div id="intro" class="ink">
  <h1>Premiers pas</h1>
  <p>le voyage d'un chaton</p>
  <button id="start">commencer</button>
  <small>avec le son, c'est encore plus doux</small>
</div>
<div id="pause" class="ink">pause · espace pour reprendre</div>
<button id="mute" class="ink" aria-label="Activer ou couper le son">son : oui</button>
<div id="error">Impossible de charger Three.js. Une connexion internet est nécessaire au premier lancement.</div>

<!-- Three.js (module ES) depuis jsDelivr, version figée pour rester reproductible. -->
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>

<script type="module">
import * as THREE from 'three';

/* ==========================================================================
   1. OUTILS
   ========================================================================== */

const PI = Math.PI, TAU = Math.PI * 2;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
/** Interpolation douce entre deux seuils (0 avant a, 1 après b). */
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
/** Amortissement indépendant du framerate : rapproche `cur` de `target`. */
const damp = (cur, target, rate, dt) => lerp(cur, target, 1 - Math.exp(-rate * dt));
const easeInOut = t => t * t * (3 - 2 * t);
const easeOut = t => 1 - Math.pow(1 - t, 3);

/** Générateur pseudo-aléatoire à graine : le décor est identique à chaque visite. */
function seeded(seed) {
  let s = seed >>> 0;
  return () => {
    s = (s + 0x6D2B79F5) >>> 0;
    let t = Math.imul(s ^ (s >>> 15), 1 | s);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rnd = seeded(20261113);
const rand = (a = 1, b) => (b === undefined ? rnd() * a : a + rnd() * (b - a));

let time = 0;            // horloge de la simulation, en secondes
const params = new URLSearchParams(location.search);
const SPEED = clamp(parseFloat(params.get('speed')) || 1, 0.1, 20);
const START_SCENE = clamp(parseInt(params.get('scene')) || 1, 1, 5);

/* ==========================================================================
   2. RENDU, SCÈNE, CAMÉRA
   ========================================================================== */

const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xf4f4f1, 9, 120);   // la brume fond les plans lointains dans le ciel

const camera = new THREE.PerspectiveCamera(34, window.innerWidth / window.innerHeight, 0.6, 300);   // plan proche éloigné : la profondeur reste précise au loin, même sur mobile

/* ==========================================================================
   3. LE MONDE : relief, ciel, plans de collines, végétation
   Le chaton avance le long de l'axe X, sur la crête d'une longue dune.
   La caméra regarde depuis +Z ; les plans de décor s'étagent vers -Z.
   ========================================================================== */

/* Repères du récit le long du chemin (en unités de scène). */
const X_START = 0;        // là où le chaton dort
const X_BUTTERFLY = 4.5;  // rencontre avec le papillon
const X_VASE = 15.5;      // le vase sur son socle
const X_YARN = 23.3;      // la pelote, juste avant la pente
const X_MOON = 59.5;      // le promontoire final

/** Grandes ondulations du parcours : une descente, puis la montée finale. */
const pathTrend = x => -2.2 * smooth(22, 43, x) + 1.8 * smooth(46, 58, x);
/** Hauteur du chemin (z = 0) : la tendance plus de petites bosses. */
const pathHeight = x => pathTrend(x) + 0.2 * Math.sin(x * 0.21 + 2.96) + 0.08 * Math.sin(x * 0.53 + 1.79);   // phases choisies pour que la pelote attende sur une bosse
/** Pente du chemin (dérivée numérique). */
const pathSlope = x => (pathHeight(x + 0.05) - pathHeight(x - 0.05)) / 0.1;
/** Hauteur du sol en tout point : une crête qui retombe de part et d'autre. */
function groundHeight(x, z) {
  const d = Math.max(0, Math.abs(z) - 1.2);
  return pathHeight(x) - (z < 0 ? 0.05 : 0.02) * d * d;
}

/* --- Ciel : un dégradé plein écran dessiné derrière tout le reste --------- */
const skyMat = new THREE.ShaderMaterial({
  uniforms: { top: { value: new THREE.Color() }, bottom: { value: new THREE.Color() } },
  vertexShader: /* glsl */`
    varying vec2 vUv;
    void main() { vUv = uv; gl_Position = vec4(position.xy, 0.999, 1.0); }`,
  fragmentShader: /* glsl */`
    precision highp float;
    uniform vec3 top; uniform vec3 bottom; varying vec2 vUv;
    void main() {
      vec3 c = mix(bottom, top, smoothstep(0.3, 1.0, vUv.y));
      gl_FragColor = vec4(c, 1.0);
      #include <colorspace_fragment>
    }`,
  depthTest: false, depthWrite: false,
});
const sky = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), skyMat);
sky.frustumCulled = false; sky.renderOrder = -10;
scene.add(sky);

/* --- Textures procédurales (dessinées dans un canvas 2D) ------------------ */
function canvasTexture(size, draw) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d'); draw(g, size);
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}
/** Texture blanche dont seule la transparence varie, écrite octet par octet.
    (Un canvas 2D stocke ses couleurs prémultipliées : sur iPhone, les zones
    presque transparentes en ressortent avec des pixels de couleurs parasites.) */
function alphaTexture(size, alphaAt) {
  const d = new Uint8Array(size * size * 4);
  for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
    const o = (y * size + x) * 4;
    d[o] = d[o + 1] = d[o + 2] = 255; d[o + 3] = Math.round(255 * clamp(alphaAt((x + 0.5) / size, (y + 0.5) / size), 0, 1));
  }
  const tex = new THREE.DataTexture(d, size, size, THREE.RGBAFormat);
  tex.colorSpace = THREE.SRGBColorSpace; tex.magFilter = tex.minFilter = THREE.LinearFilter; tex.needsUpdate = true;
  return tex;
}
// Pastille douce : pleine au centre, fondue vers le bord.
const softDot = alphaTexture(128, (u, v) => {
  const r = Math.hypot(u - 0.5, v - 0.5) * 2;
  return r < 0.35 ? lerp(1, 0.55, r / 0.35) : lerp(0.55, 0, smooth(0.35, 1, r) * 0.6 + (r - 0.35) / 0.65 * 0.4);
});

/* --- Astre : soleil pâle le jour, grande lune la nuit --------------------- */
const astro = new THREE.Group();
const astroDisc = new THREE.Mesh(new THREE.CircleGeometry(1, 64), new THREE.MeshBasicMaterial({ color: 0xffffff, fog: false }));
const astroHalo = new THREE.Sprite(new THREE.SpriteMaterial({ map: softDot, color: 0xffffff, transparent: true, opacity: 0.35, fog: false, depthWrite: false }));
astroHalo.scale.setScalar(6); astroHalo.position.z = -2;
// Grande lueur diffuse autour de l'astre : elle teinte tout un pan de ciel.
const astroGlow = new THREE.Sprite(new THREE.SpriteMaterial({ map: softDot, color: 0xffffff, transparent: true, opacity: 0.3, fog: false, depthWrite: false, depthTest: false }));
astroGlow.scale.setScalar(22); astroGlow.position.z = -1; astroGlow.renderOrder = -9;
astro.add(astroGlow, astroHalo, astroDisc);
scene.add(astro);

/* --- Étoiles : visibles seulement quand la nuit tombe --------------------- */
const starsGeo = new THREE.BufferGeometry();
{
  const pos = [];
  for (let i = 0; i < 420; i++) pos.push(rand(-150, 150), rand(2, 75), -110 - rand(20));
  starsGeo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
}
const starsMat = new THREE.PointsMaterial({ color: 0xffffff, size: 2.2, sizeAttenuation: false, map: softDot, transparent: true, opacity: 0, fog: false, depthWrite: false });
const stars = new THREE.Points(starsGeo, starsMat);
stars.frustumCulled = false;
scene.add(stars);

/* --- Nuages : quelques galets flous qui dérivent --------------------------- */
const cloudMat = new THREE.MeshBasicMaterial({ color: 0xffffff, fog: false });
const clouds = [];
{
  const blob = new THREE.CircleGeometry(1, 40);
  for (let i = 0; i < 7; i++) {
    const cloud = new THREE.Group();
    const n = 3 + Math.floor(rand(3));
    for (let j = 0; j < n; j++) {
      const m = new THREE.Mesh(blob, cloudMat);
      m.scale.set(rand(3, 6.5), rand(0.7, 1.3), 1);
      m.position.set(rand(-4, 4), rand(-0.5, 0.5), j * 0.01);
      cloud.add(m);
    }
    cloud.userData = { offset: rand(-70, 70), y: rand(7, 20), speed: rand(0.15, 0.4) };
    cloud.position.z = -100;
    clouds.push(cloud); scene.add(cloud);
  }
}

/* --- Plans de collines : des silhouettes de plus en plus pâles ------------- */
/* La couleur de chaque sommet éclaircit les crêtes et assombrit les pieds :
   chaque plan a ainsi son propre dégradé, comme une aquarelle. */
const inkMat = new THREE.MeshBasicMaterial({ color: 0x2c2c2e, vertexColors: true });
const silMat = new THREE.MeshBasicMaterial({ color: 0x2c2c2e });      // arbres et rochers posés sur les plans
const LAYERS = [
  { z: -16, base: 0.2, amp: 0.8, freq: 0.110, follow: 0.85, peaks: 0 },
  { z: -27, base: 1.3, amp: 1.3, freq: 0.071, follow: 0.6, peaks: 0 },
  { z: -42, base: 2.9, amp: 2.0, freq: 0.047, follow: 0.35, peaks: 0.5 },
  { z: -62, base: 4.2, amp: 2.8, freq: 0.031, follow: 0.15, peaks: 1 },
  { z: -90, base: 6.0, amp: 4.5, freq: 0.019, follow: 0, peaks: 1 },
];
/** Profil d'un plan : dunes arrondies au premier plan, crêtes pointues au loin. */
function layerHeight(L, i, x) {
  const p = i * 7.31;
  const round = 0.6 * Math.sin(x * L.freq + p) + 0.3 * Math.sin(x * L.freq * 2.3 + p * 1.7) + 0.1 * Math.sin(x * L.freq * 5.1 + p * 0.6);
  const sharp = 1.2 * (1 - Math.abs(Math.sin(x * L.freq * 0.9 + p))) + 0.5 * (1 - Math.abs(Math.sin(x * L.freq * 2.1 + p * 2.0))) - 0.9;
  const grain = 0.05 * Math.sin(x * L.freq * 13 + p * 3) + 0.03 * Math.sin(x * L.freq * 29 + p);   // petites irrégularités
  return L.base + pathTrend(x) * L.follow + L.amp * (lerp(round, sharp, L.peaks) + grain);
}
LAYERS.forEach((L, i) => {
  const x0 = -150, x1 = 220, step = 0.6, verts = [], cols = [], idx = [], depth = 3 + i * 2.2;
  for (let x = x0, n = 0; x <= x1; x += step, n++) {
    const top = layerHeight(L, i, x);
    verts.push(x, top, L.z, x, top - depth, L.z, x, -60, L.z);
    cols.push(1.18, 1.18, 1.18, 0.86, 0.86, 0.86, 0.8, 0.8, 0.8);
    if (n > 0) { const a = (n - 1) * 3; idx.push(a, a + 1, a + 3, a + 3, a + 1, a + 4, a + 1, a + 2, a + 4, a + 4, a + 2, a + 5); }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
  geo.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
  geo.setIndex(idx);
  scene.add(new THREE.Mesh(geo, inkMat));
});

/* Végétation en silhouette sur les plans : bosquets ronds près de nous, sapins
   plus loin, et quelques aiguilles de roche sur les crêtes lointaines. */
{
  const quad = new THREE.PlaneGeometry(1, 1), disc = new THREE.CircleGeometry(1, 28);
  const tri = new THREE.BufferGeometry();
  tri.setAttribute('position', new THREE.Float32BufferAttribute([-0.5, 0, 0, 0.5, 0, 0, 0, 1, 0], 3));
  const put = (geo, x, y, z, sx, sy) => { const m = new THREE.Mesh(geo, silMat); m.scale.set(sx, sy, 1); m.position.set(x, y, z); scene.add(m); };
  const roundTree = (x, y, z, h) => { put(quad, x, y + h / 2 - 0.1, z, 0.06 * h, h); put(disc, x, y + h, z, h * rand(0.28, 0.4), h * rand(0.42, 0.58)); };
  const pine = (x, y, z, h) => { put(quad, x, y + h * 0.15, z, 0.05 * h, h * 0.4); for (let k = 0; k < 3; k++) put(tri, x, y + h * (0.18 + k * 0.24), z, h * (0.5 - k * 0.11), h * (0.5 - k * 0.06)); };
  for (let li = 0; li < 3; li++) {
    const L = LAYERS[li], z = L.z + 0.6, size = 1 + li * 0.55;
    for (let x = -50; x < 125; x += rand(6, 18)) {
      const n = 1 + Math.floor(rand(4));                    // un bosquet de 1 à 4 arbres
      for (let k = 0; k < n; k++) {
        const tx = x + k * rand(0.7, 1.5) * size, h = rand(0.9, 2.1) * size;
        (li === 0 ? roundTree : pine)(tx, layerHeight(L, li, tx), z, h);
      }
    }
  }
  const far = LAYERS[3];
  for (let x = -60; x < 150; x += rand(14, 34)) put(disc, x, layerHeight(far, 3, x) + 0.6, far.z + 0.8, rand(0.6, 1.1), rand(2.2, 4.5));
}

/* Nappes de brume couchées entre les plans : elles détachent les crêtes. */
const mistTex = alphaTexture(64, (u, v) => { const k = 1 - v; return k < 0.55 ? 0.75 * k / 0.55 : lerp(0.75, 0.95, (k - 0.55) / 0.45); });   // transparente en haut, dense en bas
const mistMat = new THREE.MeshBasicMaterial({ map: mistTex, transparent: true, opacity: 0.5, depthWrite: false, fog: false });
const mists = [];
for (let i = 0; i < 4; i++) {
  const L = LAYERS[i + 1], h = 3.5 + i * 1.6;
  const m = new THREE.Mesh(new THREE.PlaneGeometry(420, h), mistMat);
  m.position.set(35, L.base - L.amp * 0.55 - h * 0.2, (LAYERS[i].z + L.z) / 2);
  m.userData = { y: m.position.y, follow: L.follow, phase: i * 1.7 };
  mists.push(m); scene.add(m);
}

/* Un vol d'oiseaux, très loin, qui traverse lentement le ciel. */
const birds = new THREE.Group();
{
  const wing = new THREE.BufferGeometry();
  wing.setAttribute('position', new THREE.Float32BufferAttribute([0, 0, 0, 1, 0.12, 0, 0.45, -0.1, 0], 3));
  for (let i = 0; i < 7; i++) {
    const bird = new THREE.Group();
    for (const s of [1, -1]) { const w = new THREE.Mesh(wing, silMat); w.scale.set(s * 0.55, 0.55, 1); w.material.side = THREE.DoubleSide; bird.add(w); }
    const row = Math.ceil(i / 2), side = i % 2 ? 1 : -1;                // formation en V
    bird.position.set(-row * 1.1, side * row * 0.45 + rand(-0.15, 0.15), 0);
    bird.userData.phase = rand(TAU);
    birds.add(bird);
  }
  birds.userData.offset = -40; birds.position.z = -58;
  scene.add(birds);
}

/* --- Sol : la dune sur laquelle marche le chaton --------------------------- */
const groundMat = new THREE.MeshBasicMaterial({ color: 0xf6f6f3, vertexColors: true });
const groundGeo = new THREE.PlaneGeometry(160, 28, 320, 28);
groundGeo.rotateX(-PI / 2);
groundGeo.translate(35, 0, -2);
{
  const pos = groundGeo.attributes.position, col = new Float32Array(pos.count * 3);
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), z = pos.getZ(i);
    pos.setY(i, groundHeight(x, z));
    // la dune s'assombrit doucement en s'éloignant de la crête : cela lui donne du volume
    const shade = 1 - 0.3 * smooth(1.0, 11, Math.abs(z)) - 0.04 * Math.sin(x * 0.9 + z * 1.3);
    col[i * 3] = col[i * 3 + 1] = col[i * 3 + 2] = shade;
  }
  groundGeo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  groundGeo.computeVertexNormals();
}
const ground = new THREE.Mesh(groundGeo, groundMat);
scene.add(ground);
/* Même géométrie, mais ne dessine que les ombres portées (teinte du sol maîtrisée). */
const shadowMat = new THREE.ShadowMaterial({ opacity: 0.3 });
const groundShadow = new THREE.Mesh(groundGeo, shadowMat);
groundShadow.receiveShadow = true; groundShadow.position.y = 0.003;
scene.add(groundShadow);

/* --- Végétation : touffes d'herbe, arbres boules et galets ----------------- */
const nearMat = new THREE.MeshBasicMaterial({ color: 0x141416 });    // silhouettes proches
const flowerMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
/* Zones où se jouent les scènes : on n'y plante rien devant la caméra. */
const STAGES = [[-2.5, 9.5], [13.5, 18.5], [21.5, 26], [40, 48.5], [56.5, 64]];
const onStage = x => STAGES.some(([a, b]) => x > a && x < b);
/* Obstacles au sol (disques x, z, rayon) que le chaton contourne. */
const obstacles = [];
const tufts = [];
{
  const blade = new THREE.ConeGeometry(0.022, 1, 5); blade.translate(0, 0.5, 0);
  const addTuft = (x, z, scale) => {
    const tuft = new THREE.Group();
    const n = 4 + Math.floor(rand(4));
    for (let i = 0; i < n; i++) {
      const b = new THREE.Mesh(blade, nearMat);
      b.scale.set(scale, rand(0.25, 0.6) * scale, scale);
      b.rotation.set(rand(-0.35, 0.35), 0, rand(-0.5, 0.5));
      b.position.x = rand(-0.08, 0.08) * scale;
      tuft.add(b);
    }
    tuft.position.set(x, groundHeight(x, z) - 0.02, z);
    tuft.userData.phase = rand(TAU);
    tufts.push(tuft); scene.add(tuft);
  };
  for (let x = -18; x < 82; x += rand(0.5, 1.6)) addTuft(x, rand(-7, -1.3), rand(0.7, 1.5));
  for (let x = -18; x < 82; x += rand(1.2, 3.5)) if (!onStage(x)) addTuft(x, rand(1.5, 3.2), rand(0.9, 1.6));

  // Petites fleurs claires semées le long du chemin.
  const stemGeo = new THREE.CylinderGeometry(0.006, 0.006, 1, 5); stemGeo.translate(0, 0.5, 0);
  const petalGeo = new THREE.SphereGeometry(1, 10, 8);
  for (let x = -18; x < 82; x += rand(0.6, 2.4)) {
    const z = rnd() < 0.7 ? rand(-4.5, -1.35) : rand(1.5, 2.6); if (z > 0 && onStage(x)) continue;
    const flower = new THREE.Group(), h = rand(0.12, 0.3);
    const stem = new THREE.Mesh(stemGeo, nearMat); stem.scale.y = h;
    const head = new THREE.Mesh(petalGeo, flowerMat); head.scale.set(0.035, 0.028, 0.035); head.position.y = h;
    flower.add(stem, head); flower.position.set(x, groundHeight(x, z) - 0.01, z);
    flower.userData.phase = rand(TAU); tufts.push(flower); scene.add(flower);
  }

  // Arbres « sucette », en retrait derrière le chemin.
  const trunkGeo = new THREE.CylinderGeometry(0.035, 0.06, 1, 8); trunkGeo.translate(0, 0.5, 0);
  const ballGeo = new THREE.SphereGeometry(1, 24, 18);
  for (let x = -16; x < 84; x += rand(6, 13)) {
    const z = rand(-10, -4.5), h = rand(1.1, 2.0), tree = new THREE.Group();
    const trunk = new THREE.Mesh(trunkGeo, nearMat); trunk.scale.y = h; trunk.castShadow = true;
    const crown = new THREE.Mesh(ballGeo, nearMat); crown.scale.set(h * 0.3, h * 0.42, h * 0.3); crown.position.y = h; crown.castShadow = true;
    tree.add(trunk, crown);
    tree.position.set(x, groundHeight(x, z) - 0.05, z);

  for (let i = 0; i < 26; i++) {
    const x = rand(-16, 80), z = rand() < 0.75 ? rand(-6, -1.4) : rand(1.6, 3), r = rand(0.07, 0.22);
    if (z > 0 && onStage(x)) continue;
    const rock = new THREE.Mesh(ballGeo, nearMat); rock.scale.set(r * 1.4, r * 0.8, r);
    rock.position.set(x, groundHeight(x, z) + r * 0.3, z); rock.castShadow = true;
    scene.add(rock); obstacles.push({ x, z, r: r * 1.3 });

}

/* --- Poussières portées par le vent ---------------------------------------- */

const world = { tod: 0, todGoal: 0, todRate: 0.2, moon: 0, shake: 0 };   // moon : 0 = soleil, 1 = lune levée
const _c1 = new THREE.Color(), _c2 = new THREE.Color();
const mixHex = (target, a, b, k) => target.copy(_c1.setHex(a)).lerp(_c2.setHex(b), k);

function applyPalette() {
  let i = 0;
  while (i < PALETTE.length - 2 && world.tod > PALETTE[i + 1].t) i++;
  const A = PALETTE[i], B = PALETTE[i + 1], k = clamp((world.tod - A.t) / (B.t - A.t), 0, 1);
  mixHex(skyMat.uniforms.top.value, A.top, B.top, k);

  mixHex(inkMat.color, A.ink, B.ink, k);
  silMat.color.copy(inkMat.color).multiplyScalar(0.86);

  mistMat.color.copy(scene.fog.color);
  flowerMat.color.copy(groundMat.color).lerp(_c1.setHex(0xffffff), 0.6);
  starsMat.opacity = lerp(A.stars, B.stars, k); stars.visible = starsMat.opacity > 0.02;   // aucune étoile en plein jour

  motesMat.color.copy(groundMat.color).lerp(_c1.setHex(0xffffff), 0.5);

/* ==========================================================================
   5. CAMÉRA : suit le chaton, avec de légers travellings et un parallaxe souris
   ========================================================================== */

/* Réglages courants et réglages visés ; le récit ne modifie que `camGoal`. */
const cam = { dist: 5.2, height: 0.35, az: 0.35, ahead: 0, lift: 1.15 };   // plan d'attente, sous le titre
const camGoal = { ...cam };
let camRate = 0.8;
const camTarget = new THREE.Vector3(X_START, pathHeight(X_START) + 0.4, 0);
const mouse = { x: 0, y: 0, sx: 0, sy: 0 };   // position brute et position lissée (-1..1)

window.addEventListener('pointermove', e => {
  mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouse.y = (e.clientY / window.innerHeight) * 2 - 1;
});

/** Point que la caméra suit : remplacé plus bas par la position du chaton. */
let focus = { x: X_START, y: pathHeight(X_START) };

function updateCamera(dt, t, snap = false) {
  const r = snap ? 1 : 0;
  for (const k in cam) cam[k] = r ? camGoal[k] : damp(cam[k], camGoal[k], camRate, dt);
  mouse.sx = damp(mouse.sx, mouse.x, 2.5, dt);
  mouse.sy = damp(mouse.sy, mouse.y, 2.5, dt);

  // La cible glisse vers le chaton avec un peu de retard : c'est le travelling.
  const tx = focus.x + cam.ahead, ty = focus.y + cam.lift;
  camTarget.x = r ? tx : damp(camTarget.x, tx, 2.2, dt);
  camTarget.y = r ? ty : damp(camTarget.y, ty, 1.8, dt);

  // En format portrait on recule pour garder le chaton et son décor dans le cadre.
  // On recule moins qu'avant, et on vise plus haut : le chaton reste grand, posé dans le tiers bas, sous un grand ciel.
  const port = smooth(1.25, 0.6, camera.aspect);
  const d = cam.dist * clamp(1.1 / camera.aspect, 1, 1.5);
  // Lente respiration de l'angle + parallaxe doux piloté par la souris.
  const az = cam.az + Math.sin(t * 0.11) * 0.05 + mouse.sx * 0.11;
  camera.position.set(
    camTarget.x + Math.sin(az) * d + mouse.sx * 0.3,
    camTarget.y + cam.height + Math.sin(t * 0.17) * 0.05 - mouse.sy * 0.28,
    Math.cos(az) * d);
  camera.lookAt(camTarget.x - mouse.sx * 0.12, camTarget.y + mouse.sy * 0.06 + port * 0.11 * d, 0);
  camera.rotation.z += Math.sin(t * 0.13) * 0.004 + mouse.sx * 0.005;
  // Petite secousse lors des chocs (le vase, les atterrissages ratés).
  world.shake = damp(world.shake, 0, 7, dt);
  camera.position.y += Math.sin(t * 73) * world.shake;
}

/* ==========================================================================
   6. MISE À JOUR DU DÉCOR
   ========================================================================== */

function updateWorld(dt, t) {
  world.tod = damp(world.tod, world.todGoal, world.todRate, dt);
  applyPalette();

  // L'astre et les étoiles suivent la caméra : ils semblent infiniment loin.
  const cx = camera.position.x;
  const sunY = lerp(17, -8, smooth(0.1, 0.8, world.tod));      // le soleil descend au fil du jour
  const moonY = lerp(-12, 15, easeInOut(world.moon));          // la lune se lève à la fin
  const isMoon = world.moon > 0.01;
  astro.position.set(cx * 0.96 + (isMoon ? 30 : -16), (isMoon ? moonY : sunY) + camTarget.y * 0.5, -105);
  astro.scale.setScalar(isMoon ? 7.5 : 3.2);
  stars.position.x = cx * 0.98;
  starsMat.size = 2.2 + Math.sin(t * 1.3) * 0.25;

  for (const c of clouds) {
    const u = c.userData;
    u.offset -= u.speed * dt; if (u.offset < -90) u.offset += 180;
    c.position.x = cx * 0.94 + u.offset; c.position.y = u.y + camTarget.y * 0.4;
  }

  // Les nappes de brume glissent lentement ; les oiseaux traversent le ciel.
  for (const m of mists) { m.position.x = cx + Math.sin(t * 0.05 + m.userData.phase) * 6; m.position.y = m.userData.y + pathTrend(camTarget.x) * m.userData.follow + Math.sin(t * 0.21 + m.userData.phase) * 0.15; }
  birds.userData.offset += dt * 1.6; if (birds.userData.offset > 75) birds.userData.offset = -75;
  birds.position.x = cx * 0.9 + birds.userData.offset; birds.position.y = 15 + camTarget.y * 0.6 + Math.sin(t * 0.3) * 0.6;
  birds.visible = world.tod < 0.85;
  for (const b of birds.children) { const f = Math.sin(t * 6 + b.userData.phase) * 0.7; b.children[0].rotation.z = f; b.children[1].rotation.z = -f; }

  // L'herbe ondule sous le vent.
  for (const tuft of tufts) tuft.rotation.z = Math.sin(t * 1.4 + tuft.userData.phase + tuft.position.x * 0.4) * 0.12 - 0.05;

  // Les poussières dérivent dans un volume qui se replie autour de la caméra.
  const wrap = (v, half) => ((v % (2 * half)) + 3 * half) % (2 * half) - half;
  for (let i = 0; i < MOTES; i++) {
    const m = moteSeed[i];
    motePos[i * 3] = camTarget.x + wrap(m.x - t * 0.5 * m.s - camTarget.x, 12);
    motePos[i * 3 + 1] = camTarget.y + m.y + Math.sin(t * 0.6 * m.s + m.p) * 0.35;
    motePos[i * 3 + 2] = m.z;
  }
  motesGeo.attributes.position.needsUpdate = true;

  // La lumière clé accompagne le chaton pour que son ombre reste nette.
  const lx = lerp(-3, 3.5, world.moon);
  keyLight.position.set(focus.x + lx, focus.y + 6, -4.5);
  keyLight.target.position.set(focus.x, focus.y, 0);
  fillLight.position.set(focus.x + 2, focus.y + 3, 8);
  fillLight.target.position.set(focus.x, focus.y, 0);
}

/* ==========================================================================
   7. LE CHATON
   Modelé uniquement avec des volumes lisses (sphères, capsules, révolutions)
   pour un rendu rond « à la Pixar ». Repère local : +Z = devant, +Y = haut.
   La caméra voit donc son flanc droit (-X local) quand il marche vers +X.
   ========================================================================== */

const BODY_Z = 0.86;            // corps raccourci : grosse tête, petit corps, comme un chaton
const L1 = 0.17, L2 = 0.165;   // longueurs de la cuisse (ou du bras) et de la jambe (ou de l'avant-bras)

function createKitten() {
  /* --- Matières --- */
  // Pelage noir : le « sheen » dépose un liseré velouté sur les contours.
  const fur = new THREE.MeshPhysicalMaterial({ color: 0x0b0b0d, roughness: 0.82, sheen: 1, sheenRoughness: 0.5, sheenColor: new THREE.Color(0xb4b4bc) });
  const earInner = new THREE.MeshStandardMaterial({ color: 0xd98f93, roughness: 0.85 });   // intérieur des oreilles : rose doux
  const CREAM = 0xf3e4c4, COAT = 0x0b0b0d;
  const white = new THREE.MeshPhysicalMaterial({ color: CREAM, roughness: 0.85, sheen: 0.6, sheenRoughness: 0.6, sheenColor: new THREE.Color(0xffffff) });
  // Pelage bicolore : même velours, mais la couleur vient des sommets (noir ou crème).
  const coat = new THREE.MeshPhysicalMaterial({ color: 0xffffff, vertexColors: true, roughness: 0.84, sheen: 0.8, sheenRoughness: 0.5, sheenColor: new THREE.Color(0xa8a8b0) });
  const _cBlack = new THREE.Color(COAT), _cCream = new THREE.Color(CREAM), _cMix = new THREE.Color();
  /** Écrit dans `arr` (à l'indice de sommet i) un mélange noir -> crème de poids w. */
  const paint = (arr, i, w) => { _cMix.copy(_cBlack).lerp(_cCream, clamp(w, 0, 1)); arr[i * 3] = _cMix.r; arr[i * 3 + 1] = _cMix.g; arr[i * 3 + 2] = _cMix.b; };
  const tongueMat = new THREE.MeshStandardMaterial({ color: 0xf08a94, roughness: 0.5 });
  const eyeMat = new THREE.MeshStandardMaterial({ color: 0x86a81f, roughness: 0.25, emissive: 0xb9dc2e, emissiveIntensity: 0.1 });
  const black = new THREE.MeshBasicMaterial({ color: 0x000000 });
  const glintMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
  const noseMat = new THREE.MeshStandardMaterial({ color: 0xe79a9a, roughness: 0.4 });   // truffe rose

  const unit = new THREE.SphereGeometry(1, 40, 28);
  /** Ajoute une sphère étirée (ellipsoïde) à `parent`. */
  const blob = (parent, mat, sx, sy, sz, x = 0, y = 0, z = 0, shadow = true) => {
    const m = new THREE.Mesh(unit, mat);
    m.scale.set(sx, sy, sz); m.position.set(x, y, z); m.castShadow = shadow;
    parent.add(m); return m;
  };

  /* --- Hiérarchie : racine > inclinaison (pente) > cap > bassin --- */
  const root = new THREE.Group(), tilt = new THREE.Group(), yawG = new THREE.Group(), hips = new THREE.Group();
  root.add(tilt); tilt.add(yawG); yawG.add(hips);

  /* --- Corps : un tronc souple, en deux moitiés articulées au milieu du dos ---
     L'avant-train porte la tête et les pattes avant, l'arrière-train la queue
     et les pattes arrière : c'est ce qui permet à l'échine d'onduler au pas
     et de se ramasser puis se détendre au galop. */
  const chestG = new THREE.Group(); chestG.position.z = 0.04;
  const rumpG = new THREE.Group(); rumpG.position.z = -0.04;
  hips.add(chestG, rumpG);
  const body = blob(hips, fur, 0.2, 0.195, 0.31);                        // ventre
  const chest = blob(chestG, fur, 0.192, 0.19, 0.19, 0, 0.012, 0.11);    // poitrail
  blob(chestG, fur, 0.14, 0.14, 0.13, 0, 0.1, 0.17);                      // encolure : relie la tête au corps d'une seule courbe
  const rump = blob(rumpG, fur, 0.195, 0.188, 0.19, 0, 0, -0.1);         // croupe
  // Ces volumes ne sont plus affichés : ils servent de gabarit (collision avec le sol).
  // Ce qu'on voit, c'est une peau unique tendue d'un bout à l'autre du tronc (skinBody).
  for (const m of [...hips.children, ...chestG.children, ...rumpG.children]) if (m.isMesh) m.visible = false;

  /* --- Tête : grosse et ronde, comme chez tous les chatons --- */
  const neck = new THREE.Group(); neck.position.set(0, 0.17, 0.23); chestG.add(neck);
  const head = new THREE.Group(); head.rotation.order = 'YXZ'; head.scale.setScalar(1.07); neck.add(head);
  // Le masque crème est peint dans une texture (contour net et lisse) : tout le bas
  // du visage, et une liste qui remonte en pointe entre les yeux.
  const maskCv = document.createElement('canvas'); maskCv.width = 1024; maskCv.height = 512;
  {
    const ctx = maskCv.getContext('2d'), img = ctx.createImageData(1024, 512), d = img.data;
    const c0 = [11, 11, 13], c1 = [(CREAM >> 16) & 255, (CREAM >> 8) & 255, CREAM & 255];
    for (let py = 0; py < 512; py++) for (let px = 0; px < 1024; px++) {
      const phi = px / 1024 * TAU, th = py / 512 * PI;              // même paramétrage que la sphère de Three.js
      const x = -Math.cos(phi) * Math.sin(th), y = Math.cos(th), z = Math.sin(phi) * Math.sin(th);
      const edge = -0.5 + 1.05 * Math.exp(-Math.pow(x / 0.2, 2));
      const w = smooth(0.02, -0.02, y - edge) * smooth(0.0, 0.14, z), o = (py * 1024 + px) * 4;
      for (let c = 0; c < 3; c++) d[o + c] = c0[c] + (c1[c] - c0[c]) * w;
      d[o + 3] = 255;
    }
    ctx.putImageData(img, 0, 0);
  }
  const maskTex = new THREE.CanvasTexture(maskCv); maskTex.colorSpace = THREE.SRGBColorSpace; maskTex.anisotropy = 8;
  const faceMat = new THREE.MeshPhysicalMaterial({ map: maskTex, roughness: 0.84, sheen: 0.8, sheenRoughness: 0.5, sheenColor: new THREE.Color(0xa8a8b0) });
  const skull = new THREE.Mesh(new THREE.SphereGeometry(1, 64, 48), faceMat); skull.scale.set(0.275, 0.232, 0.24); skull.position.set(0, 0.07, 0.06); skull.castShadow = true; head.add(skull);     // crâne

  // La tache blanche du museau : un seul galet lisse, posé à fleur de visage.
  blob(head, white, 0.105, 0.066, 0.05, 0, -0.045, 0.248, false);
  const nose = blob(head, noseMat, 0.021, 0.014, 0.012, 0, -0.012, 0.298, false);
  const tongue = blob(head, tongueMat, 0.02, 0.008, 0.03, 0, -0.085, 0.27, false); tongue.visible = false;   // petit bout de langue des moments facétieux
  const mouth = blob(head, black, 0.016, 0.004, 0.02, 0, -0.07, 0.285, false);

  // Yeux : très grands, presque tout en iris, avec pupille ronde et deux reflets.
  // C'est le regard qui rend le personnage attachant : on le soigne.
  // Chaque œil est un seul globe lisse, enfoncé dans la tête : iris, pupille et reflets
  // sont peints dessus. Vu de face comme de profil, rien ne dépasse ni ne se décolle.
  const eyeCv = document.createElement('canvas'); eyeCv.width = 512; eyeCv.height = 256;
  const eyeCtx = eyeCv.getContext('2d');
  const eyeTex = new THREE.CanvasTexture(eyeCv); eyeTex.colorSpace = THREE.SRGBColorSpace; eyeTex.anisotropy = 4;
  let eyePaint = -1;
  /** Repeint l'iris ; `pupil` < 1 : pupille fendue, > 1 : pupille ronde et dilatée. */
  function paintEye(pupil) {
    const key = Math.round(pupil * 40); if (key === eyePaint) return; eyePaint = key;
    const g = eyeCtx, cx = 128, cy = 128, R = 256 / PI;          // le centre du regard est à u = 0,25 ; R : pixels par radian
    g.fillStyle = '#2f3d0c'; g.fillRect(0, 0, 512, 256);         // pourtour sombre
    const grad = g.createRadialGradient(cx, cy, R * 0.3, cx, cy, R * 0.98);
    grad.addColorStop(0, '#d9f065'); grad.addColorStop(0.55, '#a9cf2c'); grad.addColorStop(1, '#6f9217');
    g.fillStyle = grad; g.beginPath(); g.arc(cx, cy, R * 0.98, 0, TAU); g.fill();
    const pw = pupil < 1 ? Math.pow(Math.max(pupil, 0.3), 2.4) : Math.min(pupil, 1.25), ph = clamp(pupil, 0.85, 1.25);
    g.fillStyle = '#050505'; g.beginPath(); g.ellipse(cx, cy, R * 0.6 * pw, R * 0.66 * ph, 0, 0, TAU); g.fill();
    g.fillStyle = '#ffffff';
    g.beginPath(); g.arc(cx + R * 0.3, cy - R * 0.36, R * 0.2, 0, TAU); g.fill();
    g.beginPath(); g.arc(cx - R * 0.3, cy + R * 0.34, R * 0.09, 0, TAU); g.fill();
    eyeTex.needsUpdate = true;
  }

    hipY = lerp(hipY, 0.23, p.tuck); hipY = lerp(hipY, 0.27, p.air);

    /* Allure : au pas, l'échine ondule et les hanches roulent ; au galop, le dos
       se ramasse (pattes regroupées) puis se détend (pattes en extension). */
    const bunch = Math.cos(ph) * run;
    hipY += Math.cos(ph * 2) * 0.016 * walk + bunch * 0.035 + Math.max(0, Math.sin(ph - 1.0)) * 0.07 * run;
    pitch += -Math.sin(ph) * 0.07 * run;
    const wig = Math.sin(t * 15) * p.wiggle;                                 // dandinement avant le bond
    chestG.rotation.set(bunch * 0.17 + 0.18 * p.sit, -Math.sin(ph) * 0.13 * walk, -Math.sin(ph) * 0.07 * walk);
    chestG.position.y = Math.sin(ph * 2) * 0.006 * walk;
    rumpG.rotation.set(-bunch * 0.26 + 0.12 * p.sit, Math.cos(ph) * 0.19 * walk + wig * 0.2, Math.cos(ph) * 0.09 * walk);
    hips.position.set(-wig * 0.008 + Math.sin(ph) * 0.014 * walk + Math.sin(t * 0.7) * 0.006 * (1 - K.move), hipY * lerp(1, p.squash, 0.7) + Math.sin(t * 2.1) * 0.004, 0);
    hips.rotation.set(pitch + p.spin, 0, p.roll + 0.22 * p.lie + Math.sin(ph) * 0.05 * walk);
    // Écrasement et étirement : le corps se tasse à chaque appui et s'allonge en l'air.
    const sq = clamp(p.squash * (1 - Math.cos(ph * 2) * 0.03 * walk - bunch * 0.05 + clamp(p.jump, 0, 0.6) * 0.22), 0.5, 1.3), inv = 1 / Math.sqrt(sq);
    hips.scale.set(inv, sq, inv * BODY_Z); neck.scale.z = 1 / BODY_Z;
    const breath = 1 + Math.sin(t * lerp(2.4, 1.3, p.lie)) * 0.022;
    body.scale.set(0.2 * breath, 0.195 * breath, 0.31 * (1 - bunch * 0.1));

    /* Tête : compense le tangage du corps pour rester à l'horizontale, et
       garde le cap pendant que les épaules roulent. */
    neck.position.y = 0.17 - 0.1 * p.lie - 0.09 * p.air;
    neck.rotation.x = -(pitch + chestG.rotation.x) * 0.92;
    const bob = Math.sin(ph * 2 - 0.9) * 0.04 * K.move - lean * 1.2;     // la tête dodeline, un temps après le corps
    const still = 1 - K.move;                                             // immobile : la tête flotte doucement, jamais figée
    head.rotation.set(p.headPitch + p.lookPitch + bob + 0.05 * p.lie + Math.sin(t * 0.9) * 0.02 * still,
      p.headYaw + p.lookYaw - chestG.rotation.y * 0.9 + Math.sin(t * 0.63 + 1) * 0.025 * still,
      p.headRoll - p.roll * 0.35 * p.air - chestG.rotation.z + p.lookYaw * 0.25);

    /* Collision du corps avec le sol : on mesure le point le plus bas des
       volumes (tronc et tête). Au repos (assis, couché, sur le dos), le corps
       est posé exactement au sol ; debout, on l'empêche seulement de s'y enfoncer. */
    root.updateMatrixWorld(true);
    let low = Infinity;
    for (const part of [body, chest, rump, skull]) {
      const e = part.matrixWorld.elements;
      low = Math.min(low, e[13] - Math.hypot(e[1], e[5], e[9]));
    }
    const rest = Math.max(p.sit, p.lie, p.air), gapY = groundY + p.jump - low;
    hips.position.y += gapY * rest + Math.max(0, gapY) * (1 - rest);
    contact.material.opacity = 0.32 * clamp(1 - p.jump * 1.6, 0, 1);
    contact.scale.set(0.6 + 0.1 * rest, 0.95 - 0.25 * p.sit, 1);

    /* Pattes : chaque pied vise un point du sol (ou de l'air, quand la patte
       est levée) ; la cinématique inverse plie coudes et genoux en conséquence. */
    hips.updateMatrix(); chestG.updateMatrix(); rumpG.updateMatrix();
    _mC.multiplyMatrices(hips.matrix, chestG.matrix); _iC.copy(_mC).invert();
    _mR.multiplyMatrices(hips.matrix, rumpG.matrix); _iR.copy(_mR).invert();
    const flying = clamp(p.jump * 5, 0, 1) * (1 - p.tuck) * (1 - p.air);
    const cyc = ph / TAU;
    for (let i = 0; i < 4; i++) {
      const L = legs[i], front = L.front, M = front ? _mC : _mR, inv = front ? _iC : _iR;
      // Cycle de l'allure (mélange pas / galop).
      const uW = (cyc + WALK[i]) % 1, uR = (cyc + RUN[i]) % 1;
      footCycle(uW, 0.62, 0.17, front ? 0.105 : 0.07, _fw); footCycle(uR, 0.34, 0.21, 0.11, _fr);
      const u = p.run > 0.5 ? uR : uW;
      if (front && u < L.u && K.move > 0.5 && K.onStep) K.onStep(p.run);     // le pied se pose : petit bruit de pas
      L.u = u;
      const gz = lerp(_fw.z, _fr.z, p.run) * K.move, gy = lerp(_fw.y, _fr.y, p.run) * K.move;
      // Pied posé au sol, dans le repère du chaton (y = 0 : le sol).
      const spread = front ? 1 - 0.3 * p.sit + 0.25 * p.lie : 1 + 0.35 * p.sit + 0.35 * p.lie;
      _t.set(L.restX * spread,
        0.05 + gy,
        L.restZ + gz + (front ? 0.22 * p.stretch + 0.12 * p.lie - 0.07 * p.sit + 0.04 * p.crouch : 0.2 * p.sit + 0.12 * p.lie));
      _pv.copy(L.pivot).applyMatrix4(M);                       // épaule ou hanche, dans ce même repère
      if (flying > 0) _t.lerp(_a.set(_pv.x, _pv.y - 0.1, _pv.z + (front ? 0.27 : -0.28)), flying);   // en plein saut : pattes en extension
      if (i === 0 && p.paw > 0) {                               // patte tendue : vers l'objet visé, s'il y en a un
        if (K.reach) yawG.worldToLocal(_a.copy(K.reach)); else _a.set(_pv.x * 0.6, _pv.y + 0.08, _pv.z + 0.3);
        _t.lerp(_a, clamp(p.paw, 0, 1.15));
      }
      _t.applyMatrix4(inv);                                    // vers le repère du demi-tronc
      // Poses où les pattes ne touchent plus terre : en boule, ou sur le dos à pédaler.
      if (p.tuck > 0) _t.lerp(_a.set(L.pivot.x, L.pivot.y - 0.15, L.pivot.z + (front ? -0.09 : 0.09)), p.tuck);
      if (p.air > 0) _t.lerp(_a.set(L.pivot.x, L.pivot.y - 0.22 + Math.sin(t * 10 + i * 2.3) * 0.05, L.pivot.z + (front ? -0.03 : 0.05) + Math.sin(t * 10 + i * 1.9) * 0.12), p.air);
      solveLeg(L, _t.x, _t.y, _t.z);
      // Le poignet est souple : la patte pend quand elle se lève, puis se pose à plat.
      const free = Math.max(p.tuck, p.air);
      L.paw.rotation.x = (gy * 9 - (L.leg.rotation.x + L.knee.rotation.x) - (pitch + L.parentG.rotation.x)) * (1 - free) + 0.5 * free;
    }

    /* Yeux : clignements spontanés, pupilles, regard (qui suit un peu la souris). */
    K.blinkT -= dt;
    if (K.blinkT < 0) { K.blink = 0.13; K.blinkT = 1.6 + Math.random() * 3.6; }
    K.blink = Math.max(0, K.blink - dt);
    K.lid = damp(K.lid, K.blink > 0 ? 0.06 : 1, 38, dt);
    const open = Math.max(0.055, p.eyeOpen * K.lid * (1 - 0.42 * clamp(p.lidTop, 0, 1)));   // paupière mi-close : l'œil s'aplatit, sans relief ajouté
    // Les yeux partent avant la tête : ils visent déjà la cible pendant qu'elle tourne.
    const gx = p.gazeX + mouse.sx * Math.cos(p.yaw + p.headYaw) * 0.5 + clamp((g.headYaw + g.lookYaw - p.headYaw - p.lookYaw) * 1.6, -1, 1);
    const gy = p.gazeY - mouse.sy * 0.35 - clamp((g.headPitch + g.lookPitch - p.headPitch - p.lookPitch) * 1.6, -1, 1);
    for (const e of eyes) {
      e.eye.scale.y = open;
      e.eye.visible = open > 0.2; e.shut.visible = !e.eye.visible;   // fermé : plus aucune couleur visible
      e.shut.rotation.z = -e.side * 0.12;
      e.eye.rotation.z = -e.side * (0.5 * (1 - open) + 0.1 * p.brow);   // paupière close : un petit arc paisible
      // Le regard : le globe pivote légèrement dans son orbite.
      e.look.rotation.set(-clamp(gy, -1, 1) * 0.2, clamp(gx - e.side * p.cross * 1.3, -1.3, 1.3) * 0.24, 0);
    }
    paintEye(p.pupil);   // pupille ronde et immense quand il est attendri ou joueur, fendue quand il a peur
    eyeMat.emissiveIntensity = 0.08 + 0.35 * smooth(0.6, 1, world.tod);   // les yeux luisent la nuit

    /* Oreilles : se couchent sous l'émotion, tressaillent de temps en temps. */
    // Inertie : les oreilles traînent derrière les mouvements de la tête et du corps.
    const vy = dt > 0 ? (root.position.y - K.prevY) / dt : 0; K.prevY = root.position.y;
    K.earLag = damp(K.earLag, clamp((K.v.headPitch || 0) * 0.07 + vy * 0.14, -0.5, 0.5), 12, dt);
    K.flickT -= dt;
    if (K.flickT < 0) { ears[Math.random() < 0.5 ? 0 : 1].flick = 1; K.flickT = 2 + Math.random() * 5; }
    for (const e of ears) {
      e.flick = Math.max(0, e.flick - dt * 4.5);
      const f = Math.sin(e.flick * PI * 2) * e.flick * 0.35;
      e.ear.rotation.set(-0.75 * p.earBack - Math.sin(ph * 2 - 1.6) * 0.1 * K.move + K.earLag, 0, -e.side * (0.3 + 0.4 * p.earBack + f));   // elles rebondissent à contretemps
    }
    tongue.visible = p.tongue > 0.05; tongue.position.set(0, -0.072 - 0.012 * p.tongue, 0.268 + 0.022 * p.tongue); tongue.rotation.x = 0.6 * p.tongue;
    mouth.visible = p.mouth > 0.06;                            // pas de trait de bouche au repos : seulement quand il miaule ou bâille
    mouth.scale.set(0.016 + 0.008 * p.mouth, 0.004 + 0.034 * p.mouth, 0.02);

    /* Queue : une onde parcourt la chaîne d'articulations. */
    K.tipT -= dt; if (K.tipT < 0) { K.tipT = 0.8 + Math.random() * 2.5; K.tip = 1; }       // le bout de la queue tressaille
    K.tip = Math.max(0, K.tip - dt * 2.2);
    tail[0].joint.rotation.x = lerp(-2.0, -0.35, (p.tailUp + 1) / 2) - (pitch + rumpG.rotation.x) * 0.8;
    for (let i = 1; i < tail.length; i++) {
      const j = tail[i].joint;
      j.rotation.x = clamp(-vy * 0.03, -0.07, 0.07) + 0.068 * p.tailUp + Math.sin(t * 2.2 - i * 0.37) * 0.07 * (1 - p.lie) + Math.sin(ph * 2 - i * 0.4) * 0.03 * K.move;
      j.rotation.z = Math.sin(t * (1.6 + 4 * p.wiggle) - i * 0.33) * p.tailWag * 0.15 + p.tailWrap * 0.2
        - Math.sin(ph - i * 0.35) * 0.1 * K.move
        + (i > tail.length - 7 ? Math.sin(K.tip * 9) * K.tip * 0.16 : 0);      // la queue fait contrepoids à chaque pas
    }
    skinTail(p.tailFluff);   // tailFluff : la queue en écouvillon des grandes frayeurs
  };
  return K;
}

const K = createKitten();

   Des sprites dessinés au canvas, tirés d'une réserve et recyclés.

const CORAL = 0xff5d73;   // accent n° 1 : le papillon et les cœurs
const GOLD = 0xffcf5c;    // accent n° 2 : les lucioles

const glyph = ch => canvasTexture(128, g => {
  g.fillStyle = '#fff'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.font = 'italic 104px Georgia, "Times New Roman", serif'; g.fillText(ch, 64, 68);
});
const GLYPHS = {
  z: glyph('z'), what: glyph('?'), bang: glyph('!'), dust: softDot,
  heart: canvasTexture(128, g => {
    g.fillStyle = '#fff'; g.beginPath(); g.moveTo(64, 110);
    g.bezierCurveTo(-6, 62, 22, 8, 64, 42); g.bezierCurveTo(106, 8, 134, 62, 64, 110); g.fill();
  }),
  note: canvasTexture(128, g => {
    g.fillStyle = g.strokeStyle = '#fff'; g.lineWidth = 7; g.lineCap = 'round';
    g.beginPath(); g.ellipse(48, 96, 19, 14, -0.4, 0, TAU); g.fill();
    g.beginPath(); g.moveTo(64, 92); g.lineTo(64, 22); g.quadraticCurveTo(84, 30, 92, 56); g.stroke();
  }),
  star: canvasTexture(128, g => {
    g.fillStyle = '#fff'; g.beginPath();
    for (let i = 0; i < 8; i++) { const r = i % 2 ? 14 : 58, a = i * PI / 4; g.lineTo(64 + Math.sin(a) * r, 64 - Math.cos(a) * r); }
    g.fill();
  }),
};

const emotes = [];
for (let i = 0; i < 56; i++) {
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ transparent: true, depthWrite: false, fog: false }));
  s.visible = false; s.renderOrder = 5; scene.add(s); emotes.push({ sprite: s, life: 0 });
}
/** Couleur des signes : encre sombre le jour, blanc la nuit. */
const inkNow = () => (world.tod < 0.8 ? 0x2a1c36 : 0xf4f4ff);

/** Fait apparaître un signe. o : { color, size, life, vx, vy, sway, grow } */
function emote(type, x, y, z, o = {}) {
  const e = emotes.find(e => e.life <= 0); if (!e) return;
  Object.assign(e, { life: o.life || 1.6, age: 0, total: o.life || 1.6, size: o.size || 0.24, vx: o.vx || 0, vy: o.vy ?? 0.35, sway: o.sway || 0, grow: o.grow || 0, phase: Math.random() * TAU });
  e.sprite.material.map = GLYPHS[type]; e.sprite.material.color.setHex(o.color ?? inkNow());
  e.sprite.material.rotation = o.tilt || 0;
  e.sprite.position.set(x, y, z); e.sprite.visible = true;
}
function updateEmotes(dt, t) {
  for (const e of emotes) {
    if (e.life <= 0) continue;
    e.life -= dt; e.age += dt;
    if (e.life <= 0) { e.sprite.visible = false; continue; }
    e.sprite.position.x += (e.vx + Math.sin(t * 3 + e.phase) * e.sway) * dt;
    e.sprite.position.y += e.vy * dt;
    e.sprite.scale.setScalar(e.size * easeOut(Math.min(1, e.age * 5)) * (1 + e.grow * e.age));
    e.sprite.material.opacity = Math.min(1, e.life / (e.total * 0.4));
  }
}
/** Un point juste au-dessus de la tête du chaton. */
const overHead = (dy = 0) => [K.x + 0.2, K.root.position.y + 1.0 + 0.12 * K.p.sit - 0.5 * K.p.lie + dy, K.p.z + 0.1];
const puff = (x, z = 0, n = 5) => {
  for (let i = 0; i < n; i++) emote('dust', x + (Math.random() - 0.5) * 0.4, groundHeight(x, z) + 0.08, z + 0.15, {
    color: 0xa8a8a6, size: 0.3, life: 0.8, vx: (Math.random() - 0.5) * 0.8, vy: 0.25 + Math.random() * 0.3, grow: 1.6 });
};

   9. ACCESSOIRES DU RÉCIT : papillon, vase, pelote, lucioles, étoile filante

const _goal = new THREE.Vector3();

/* --- Le papillon (corail) --------------------------------------------------- */
const B = (() => {
  const group = new THREE.Group(); group.visible = false; group.rotation.order = 'YXZ';
  const mat = new THREE.MeshBasicMaterial({ color: CORAL, side: THREE.DoubleSide, fog: false });
  const disc = new THREE.CircleGeometry(1, 20); disc.rotateX(-PI / 2);     // les ailes sont à plat
  const wings = [];
  for (const s of [1, -1]) {
    const wing = new THREE.Group();
    const a = new THREE.Mesh(disc, mat); a.scale.set(0.075, 1, 0.062); a.position.set(s * 0.078, 0, 0.03);
    const b = new THREE.Mesh(disc, mat); b.scale.set(0.05, 1, 0.046); b.position.set(s * 0.055, 0, -0.045);
    wing.add(a, b); group.add(wing); wings.push(wing);
  }
  const bodyGeo = new THREE.CapsuleGeometry(0.009, 0.08, 4, 8); bodyGeo.rotateX(PI / 2);
  group.add(new THREE.Mesh(bodyGeo, new THREE.MeshBasicMaterial({ color: 0x111113, fog: false })));
  scene.add(group);
  const B = { group, pos: new THREE.Vector3(), aim: null, flutter: 1, perch: false, rate: 2.2 };
  B.appear = (x, y, z) => { B.pos.set(x, y, z); group.position.copy(B.pos); group.visible = true; B.flutter = 1; B.perch = false; };
  B.hide = () => { group.visible = false; B.aim = null; };
  B.update = (dt, t) => {
    if (!group.visible) return;
    if (B.aim) B.aim(_goal);
    const dist = B.pos.distanceTo(_goal);
    B.pos.lerp(_goal, 1 - Math.exp(-(B.perch ? 4.5 : B.rate) * dt));
    const settled = B.perch ? 1 - smooth(0.03, 0.4, dist) : 0;    // posé : il ne volette plus
    const f = B.flutter * (1 - settled);
    group.position.set(B.pos.x + Math.sin(t * 5.3) * 0.09 * f, B.pos.y + Math.sin(t * 7.7) * 0.07 * f, B.pos.z + Math.cos(t * 4.1) * 0.08 * f);
    const flap = lerp(Math.abs(Math.sin(t * 21)) * 1.5 - 0.25, 0.75 + Math.sin(t * 3.2) * 0.45, settled);
    wings[0].rotation.z = flap; wings[1].rotation.z = -flap;
    group.rotation.set(-0.35, PI / 2 + Math.sin(t * 1.3) * 0.6 * f + 0.5, 0);
  };
  return B;
})();

/* --- Le vase sur son socle --------------------------------------------------- */
const V = (() => {
  const base = new THREE.Group(); base.position.set(X_VASE, groundHeight(X_VASE, 0) - 0.02, 0); scene.add(base);
  const stone = new THREE.MeshStandardMaterial({ color: 0xd9d9d5, roughness: 0.95 });
  const ceramic = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.28, side: THREE.DoubleSide });
  const dark = new THREE.MeshStandardMaterial({ color: 0x111113, roughness: 0.6 });
  const cyl = (rt, rb, h, y) => { const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, 36), stone); m.position.y = y; m.castShadow = true; base.add(m); };
  cyl(0.17, 0.185, 0.05, 0.025); cyl(0.115, 0.13, 0.3, 0.2); cyl(0.175, 0.14, 0.05, 0.375);
  const TOP = 0.4;
  obstacles.push({ x: X_VASE, z: 0, r: 0.2 });       // le chaton contourne le socle

  // Profil du vase, tourné autour de son axe.
  const profile = new THREE.SplineCurve([[0.001, 0], [0.07, 0.004], [0.115, 0.07], [0.12, 0.15], [0.085, 0.25], [0.05, 0.31], [0.052, 0.35], [0.075, 0.38]].map(p => new THREE.Vector2(...p))).getPoints(30);
  const vase = new THREE.Group();
  const pot = new THREE.Mesh(new THREE.LatheGeometry(profile, 40), ceramic); pot.castShadow = true;
  const band = new THREE.Mesh(new THREE.TorusGeometry(0.119, 0.007, 8, 48), dark); band.rotation.x = PI / 2; band.position.y = 0.13;
  // Une fleur noire, toute simple.
  const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.005, 0.005, 0.36, 6), dark); stem.position.y = 0.5;
  const bloom = new THREE.Mesh(new THREE.SphereGeometry(0.05, 20, 14), dark); bloom.position.y = 0.69; bloom.castShadow = true;
  const flower = new THREE.Group(); flower.add(stem, bloom);
  vase.add(pot, band, flower); base.add(vase);

  // Les éclats, cachés tant que le vase est entier.
  const shards = [];
  const shardGeo = new THREE.TetrahedronGeometry(0.055);
  for (let i = 0; i < 12; i++) {
    const m = new THREE.Mesh(shardGeo, ceramic); m.castShadow = true; m.visible = false;
    base.add(m); shards.push({ m, v: new THREE.Vector3(), w: new THREE.Vector3(), rest: true });
  }

  const V = { broken: false, falling: false, wobble: 0, slide: 0, lookPoint: new THREE.Vector3(X_VASE, base.position.y + 0.62, 0), debris: new THREE.Vector3() };
  const vel = new THREE.Vector3(); let spin = 0;
  V.reset = () => {
    V.broken = V.falling = false; V.wobble = V.slide = 0;
    vase.visible = true; vase.position.set(0, TOP, 0); vase.rotation.set(0, 0, 0);
    vase.add(flower); flower.position.set(0, 0, 0); flower.rotation.set(0, 0, 0);
    for (const s of shards) { s.m.visible = false; s.rest = true; }
  };
  V.fall = () => { V.falling = true; vel.set(0.75, 0.35, 0.12); spin = -1.2; };
  const floor = (x, z) => groundHeight(base.position.x + x, z) - base.position.y;
  V.update = (dt, t) => {
    if (V.falling) {
      vel.y -= 9.8 * dt; spin -= 10 * dt;
      vase.position.addScaledVector(vel, dt); vase.rotation.z += spin * dt;
      if (vase.position.y < floor(vase.position.x, vase.position.z) + 0.08) {   // il touche le sol : il éclate
        V.falling = false; V.broken = true; vase.visible = false;
        const p = vase.position;
        V.debris.set(base.position.x + p.x + 0.2, base.position.y + floor(p.x, p.z), p.z);
        for (const s of shards) {
          s.m.visible = true; s.rest = false;
          s.m.position.set(p.x + (Math.random() - 0.5) * 0.2, p.y + Math.random() * 0.25, p.z + (Math.random() - 0.5) * 0.2);
          s.m.scale.set(0.5 + Math.random(), 0.25 + Math.random() * 0.4, 0.5 + Math.random());
          s.v.set(Math.random() * 1.6 - 0.3, 1 + Math.random() * 2, Math.random() * 1.6 - 0.5);
          s.w.set(Math.random() * 12 - 6, Math.random() * 12 - 6, Math.random() * 12 - 6);
        }
        base.add(flower);                                                       // la fleur, elle, reste couchée là
        flower.position.set(p.x - 0.15, floor(p.x + 0.3, 0.3) + 0.03, 0.3); flower.rotation.set(0.3, 0, -PI / 2);
      }
    } else if (!V.broken) {
      V.wobble *= Math.exp(-2.6 * dt);                                           // l'oscillation s'amortit
      vase.position.x = V.slide;
      vase.rotation.z = Math.sin(t * 17) * V.wobble;
    }
    for (const s of shards) {
      if (s.rest) continue;
      s.v.y -= 9.8 * dt; s.m.position.addScaledVector(s.v, dt);
      s.m.rotation.x += s.w.x * dt; s.m.rotation.y += s.w.y * dt; s.m.rotation.z += s.w.z * dt;
      // Collisions des éclats : le socle les repousse, le chaton aussi.
      for (const [cx, cz, cr, top] of [[0, 0, 0.2, TOP], [K.x - base.position.x, K.root.position.z, 0.27, 0.5]]) {
        const ox = s.m.position.x - cx, oz = s.m.position.z - cz, d = Math.hypot(ox, oz);
        if (d < cr && d > 1e-4 && s.m.position.y < top) { s.m.position.x = cx + ox / d * cr; s.m.position.z = cz + oz / d * cr; s.v.x = ox / d * 0.6; s.v.z = oz / d * 0.6; }
      }
      const f = floor(s.m.position.x, s.m.position.z) + 0.02;
      if (s.m.position.y < f) {
        s.m.position.y = f;
        if (Math.abs(s.v.y) < 0.6) s.rest = true;
        s.v.y *= -0.32; s.v.x *= 0.55; s.v.z *= 0.55; s.w.multiplyScalar(0.5);
      }
    }
  };
  return V;
})();

/* --- La pelote, et le fil qu'elle laisse derrière elle ------------------------ */
const Y = (() => {
  const tex = canvasTexture(256, (g, s) => {
    g.fillStyle = '#f6f6f3'; g.fillRect(0, 0, s, s);
    g.strokeStyle = 'rgba(25,25,28,.5)'; g.lineWidth = 2;
    for (let i = 0; i < 90; i++) {   // des brins qui s'entrecroisent
      const y = rand(s), a = rand(-0.9, 0.9);
      g.beginPath(); g.moveTo(-10, y); g.bezierCurveTo(s * 0.3, y + a * 90, s * 0.7, y - a * 90, s + 10, y + a * 40); g.stroke();
    }
  });
  const R = 0.16;
  const mesh = new THREE.Mesh(new THREE.SphereGeometry(R, 32, 24), new THREE.MeshStandardMaterial({ map: tex, roughness: 0.95 }));
  mesh.castShadow = true; scene.add(mesh);
  const MAXP = 500, threadPos = new Float32Array(MAXP * 3), threadGeo = new THREE.BufferGeometry();
  threadGeo.setAttribute('position', new THREE.BufferAttribute(threadPos, 3));
  const threadMat = new THREE.LineBasicMaterial({ color: 0x202022 });
  const thread = new THREE.Line(threadGeo, threadMat);
  thread.frustumCulled = false; scene.add(thread);

  const Y = { mesh, pos: mesh.position, x: X_YARN, v: 0, free: false, held: false, n: 0, last: X_YARN };
  obstacles.push({ get x() { return Y.x; }, z: 0.12, r: R + 0.14, get off() { return Y.held; } });   // le chaton la contourne aussi
  Y.reset = () => { Object.assign(Y, { x: X_YARN, v: 0, free: false, held: false, n: 0, last: X_YARN }); threadGeo.setDrawRange(0, 0); mesh.rotation.set(0, 0, 0); };
  Y.update = (dt, t) => {
    threadMat.color.copy(nearMat.color);
    if (Y.held) {   // entre les pattes du chaton couché sur le dos
      mesh.position.set(K.x + 0.03, K.root.position.y + 0.5 + Math.sin(t * 9) * 0.035, 0.24);
      mesh.rotation.x += dt * 5; mesh.rotation.z += dt * 3; Y.x = K.x;
      return;
    }
    if (Y.free) {   // elle roule : la pente l'entraîne, le frottement la freine
      const slope = pathSlope(Y.x);
      Y.v += (-9.8 * slope * 0.6 - 0.22 * Y.v - Math.sign(Y.v) * 0.05) * dt;
      if (Math.abs(Y.v) < 0.06 && Math.abs(slope) < 0.04) Y.v = 0;
      Y.x += Y.v * dt;
      // Collision avec le chaton : la pelote bute contre lui et rebondit mollement.
      const gap = Y.x - K.x, reach = R + 0.27;
      if (K.p.jump < 0.1 && Math.abs(K.root.position.z - 0.12) < 0.3 && Math.abs(gap) < reach) {
        const side = Math.sign(gap) || 1;
        Y.x = K.x + side * reach;
        if (Y.v * side < 0) Y.v *= -0.35;
      }
      mesh.rotation.z -= Y.v * dt / R;
      while (Y.x - Y.last > 0.1 && Y.n < MAXP) {   // le fil se dévide derrière elle
        Y.last += 0.1;
        threadPos.set([Y.last, pathHeight(Y.last) + 0.012, 0.12 + Math.sin(Y.last * 3.1) * 0.06], Y.n * 3);
        threadGeo.setDrawRange(0, ++Y.n); threadGeo.attributes.position.needsUpdate = true;
      }
    }
    const hop = Math.abs(Math.sin(Y.x * 2.1)) * 0.09 * clamp(Math.abs(Y.v) / 3, 0, 1);   // petits rebonds
    mesh.position.set(Y.x, pathHeight(Y.x) + R + hop, 0.12);
  };
  return Y;
})();

/* --- Les lucioles (or), dont une plus curieuse que les autres ------------------- */
const F = (() => {
  const N = 46, seeds = [], pos = new Float32Array(N * 3), geo = new THREE.BufferGeometry();
  for (let i = 0; i < N; i++) seeds.push({ x: X_MOON + rand(-11, 9), y: rand(0.3, 2.9), z: rand(-6, 2.4), p: rand(TAU), s: rand(0.4, 1.1) });
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const mat = new THREE.PointsMaterial({ color: GOLD, size: 0.13, map: softDot, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false, fog: false });
  const points = new THREE.Points(geo, mat); points.frustumCulled = false; scene.add(points);
  // La luciole « héroïne » : un sprite et une petite lumière qui dore le museau.
  const hero = new THREE.Sprite(new THREE.SpriteMaterial({ map: softDot, color: GOLD, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false, fog: false }));
  hero.scale.setScalar(0.2); hero.renderOrder = 6;

      pos[i * 3 + 2] = s.z + Math.cos(t * s.s * 0.8 + s.p) * 0.5;
    }
    geo.attributes.position.needsUpdate = true;
    F.heroLevel = damp(F.heroLevel, F.heroOn, 2, dt);
    if (F.aim) { F.aim(_goal); F.pos.lerp(_goal, 1 - Math.exp(-1.8 * dt)); }
    hero.position.copy(F.pos);
    hero.material.opacity = F.heroLevel * (0.85 + 0.15 * Math.sin(t * 9));
    glow.position.copy(F.pos); glow.intensity = F.heroLevel * 0.2;
  };

})();

{

function updateShooting(dt) {

/* ==========================================================================
   10. SON : musique générative, ambiance et bruitages
   ========================================================================== */
/* Tout le son est synthétisé avec l'API Web Audio : oscillateurs, bruit
   filtré, enveloppes. Rien n'est chargé. Le contexte audio n'est créé
   qu'au premier clic, comme l'exigent les navigateurs. */

/** Réglages musicaux que le récit fait évoluer. */
const music = {
  energy: 0.3,    // 0 = quelques notes éparses, 1 = la course-poursuite
  night: 0,       // 1 = tempo ralenti, notes plus graves, grillons
  queue: [],      // notes imposées (la petite berceuse du début et de la fin)
  motif() { this.queue = [78, 0, 81, 0, 83, 0, 0, 81, 78, 0, 76, 0, 74, 0, 0, 0, 69, 0, 74, 0, 0, 0]; },
};

const audio = (() => {
  let ctx = null, master, musicBus, sfxBus, reverb, echo, noiseBuf, windGain, windFilter, purrGain;
  let muted = false, purring = false, nextStep = 0, stepIndex = 0, degree = 4, nextChirp = 0;
  const now = () => ctx.currentTime;
  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
  const gainNode = (v, dest) => { const g = ctx.createGain(); g.gain.value = v; if (dest) g.connect(dest); return g; };

  /* --- Briques de synthèse --- */
  /** Enveloppe percussive : attaque `a`, puis extinction exponentielle `d`. */
  function envelope(g, t, a, peak, d) {
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(Math.max(peak, 0.0002), t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + a + d);
  }
  /** Une note d'oscillateur, avec glissando facultatif de f vers f2. */
  function tone({ type = 'sine', f, f2, t = now(), a = 0.005, d = 0.3, gain = 0.2, dest = sfxBus, vibrato = 0 }) {
    const o = ctx.createOscillator(), g = gainNode(0, dest);
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + a + d);
    if (vibrato) { const l = ctx.createOscillator(), lg = gainNode(vibrato, o.frequency); l.frequency.value = 6.5; l.connect(lg); l.start(t); l.stop(t + a + d + 0.1); }
    envelope(g, t, a, gain, d);
    o.connect(g); o.start(t); o.stop(t + a + d + 0.1);
    return g;
  }
  /** Une bouffée de bruit filtré (souffles, chocs, frottements). */
  function noise({ type = 'bandpass', f = 1000, f2, q = 1, t = now(), a = 0.005, d = 0.2, gain = 0.2, dest = sfxBus }) {
    const src = ctx.createBufferSource(), filter = ctx.createBiquadFilter(), g = gainNode(0, dest);
    src.buffer = noiseBuf; src.loop = true;
    filter.type = type; filter.Q.value = q; filter.frequency.setValueAtTime(f, t);
    if (f2) filter.frequency.exponentialRampToValueAtTime(f2, t + a + d);
    envelope(g, t, a, gain, d);
    src.connect(filter); filter.connect(g);
    src.start(t, Math.random() * 1.5); src.stop(t + a + d + 0.1);
  }

  /* --- Musique générative : nappe, basse, et un kalimba qui se promène --- */
  const SCALE = [62, 64, 66, 69, 71, 74, 76, 78, 81, 83];                 // ré majeur pentatonique
  const CHORDS = [[50, 57, 66], [47, 54, 62], [43, 50, 59], [45, 52, 61]];   // ré, si mineur, sol, la
  function pluck(midi, t, gain, decay) {
    const f = mtof(midi), g = gainNode(1, musicBus);
    g.connect(echo);
    tone({ f, t, a: 0.004, d: decay, gain, dest: g });
    tone({ f: f * 2, t, a: 0.003, d: decay * 0.35, gain: gain * 0.28, dest: g });
    tone({ f: f * 5.4, t, a: 0.002, d: 0.06, gain: gain * 0.12, dest: g });   // le « tic » de la lame
  }
  function pad(chord, t, len) {
    const filter = ctx.createBiquadFilter(); filter.type = 'lowpass'; filter.frequency.value = lerp(900, 600, music.night);
    const g = gainNode(0, musicBus); filter.connect(g);
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.05, t + len * 0.4);
    g.gain.linearRampToValueAtTime(0.0001, t + len * 1.35);
    for (const m of chord) for (const detune of [-5, 6]) {
      const o = ctx.createOscillator(); o.type = 'triangle'; o.frequency.value = mtof(m); o.detune.value = detune;
      o.connect(filter); o.start(t); o.stop(t + len * 1.4);
    }
    tone({ f: mtof(chord[0] - 12), t, a: 0.08, d: len * 0.9, gain: 0.11, dest: musicBus });   // basse
  }
  function playStep(i, t) {
    const beat = i % 8, chord = CHORDS[Math.floor(i / 8) % 4], e = music.energy;
    if (beat === 0) pad(chord, t, (nextStepDur()) * 8);
    if (music.queue.length) {                       // la berceuse a la priorité
      const m = music.queue.shift(); if (m) pluck(m, t, 0.17, 2.4);
      return;
    }
    if (beat === 0 || Math.random() < 0.15 + e * 0.6) {
      degree += [-2, -1, -1, 1, 1, 2][Math.floor(Math.random() * 6)];
      if (degree < 0) degree = 1; if (degree > SCALE.length - 1) degree = SCALE.length - 2;
      pluck(SCALE[degree] - (music.night > 0.5 && degree > 5 ? 12 : 0), t, 0.06 + 0.07 * e, lerp(1.4, 2.2, music.night));
    }
    if (e > 0.8) {                                  // la poursuite : un petit moteur rythmique
      noise({ type: 'highpass', f: 6500, t, a: 0.002, d: 0.035, gain: beat % 2 ? 0.012 : 0.03, dest: musicBus });
      if (beat % 4 === 0) tone({ f: mtof(chord[0]), f2: mtof(chord[0]) * 0.98, t, a: 0.004, d: 0.22, gain: 0.16, dest: musicBus });
    }
  }
  const nextStepDur = () => lerp(lerp(0.31, 0.24, smooth(0.7, 1, music.energy)), 0.4, music.night);

  /** Appelée régulièrement : programme les notes un peu en avance et fait vivre l'ambiance. */
  function schedule() {
    if (!ctx || ctx.state !== 'running') return;
    const t = now();
    if (nextStep < t) nextStep = t + 0.05;
    while (nextStep < t + 0.3) { playStep(stepIndex++, nextStep); nextStep += nextStepDur(); }
    // Vent : son volume et sa couleur respirent lentement.
    windGain.gain.setTargetAtTime(0.022 + 0.02 * (0.5 + 0.5 * Math.sin(t * 0.21)) + 0.02 * music.night, t, 1.2);
    windFilter.frequency.setTargetAtTime(380 + 220 * Math.sin(t * 0.13), t, 1.5);
    // Ronron : il suit la respiration.
    purrGain.gain.setTargetAtTime(purring ? 0.5 + 0.3 * Math.sin(t * 2.7) : 0, t, purring ? 0.15 : 0.5);
    // Grillons, la nuit venue.
    if (music.night > 0.4 && t > nextChirp) {
      const f = 4100 + Math.random() * 500;
      for (let k = 0; k < 3; k++) tone({ f, t: t + k * 0.055, a: 0.004, d: 0.03, gain: 0.01 });
      nextChirp = t + 0.5 + Math.random() * 1.3;
    }
  }

  /* --- Mise en route (au premier clic) --- */
  function start() {
    if (ctx) { ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    ctx = new AC();
    master = gainNode(muted ? 0 : 0.9);
    const comp = ctx.createDynamicsCompressor(); master.connect(comp); comp.connect(ctx.destination);

    // Bruit blanc, matière première de tous les souffles.
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
    const nd = noiseBuf.getChannelData(0); for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;

    // Réverbération : une réponse impulsionnelle fabriquée (bruit qui s'éteint).
    const len = Math.floor(ctx.sampleRate * 2.8), ir = ctx.createBuffer(2, len, ctx.sampleRate);
    for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.6); }
    reverb = ctx.createConvolver(); reverb.buffer = ir; reverb.connect(gainNode(0.45, master));

    // Écho doux pour le kalimba.
    echo = gainNode(0.3);
    const delay = ctx.createDelay(1.5), feedback = gainNode(0.3), damping = ctx.createBiquadFilter();
    delay.delayTime.value = 0.42; damping.type = 'lowpass'; damping.frequency.value = 2200;
    echo.connect(delay); delay.connect(damping); damping.connect(feedback); feedback.connect(delay);
    damping.connect(master); damping.connect(reverb);

    musicBus = gainNode(0.95, master); musicBus.connect(gainNode(0.5, reverb));
    sfxBus = gainNode(0.9, master); sfxBus.connect(gainNode(0.22, reverb));

    // Vent : un bruit filtré qui tourne en boucle.
    const wind = ctx.createBufferSource(); wind.buffer = noiseBuf; wind.loop = true;
    windFilter = ctx.createBiquadFilter(); windFilter.type = 'bandpass'; windFilter.frequency.value = 420; windFilter.Q.value = 0.6;
    windGain = gainNode(0, master); wind.connect(windFilter); windFilter.connect(windGain); wind.start();

    // Ronron : un grondement grave haché une vingtaine de fois par seconde.
    const purr = ctx.createBufferSource(); purr.buffer = noiseBuf; purr.loop = true;
    const purrFilter = ctx.createBiquadFilter(); purrFilter.type = 'lowpass'; purrFilter.frequency.value = 230;
    const chop = gainNode(0.5), lfo = ctx.createOscillator(); lfo.type = 'sawtooth'; lfo.frequency.value = 23;
    lfo.connect(gainNode(0.5, chop.gain));
    purrGain = gainNode(0, master);
    purr.connect(purrFilter); purrFilter.connect(chop); chop.connect(purrGain); purr.start(); lfo.start();

    setInterval(schedule, 60);
  }

  /* --- Bruitages --- */
  const fx = {
    step: run => noise({ f: 650, q: 0.8, a: 0.002, d: 0.045, gain: 0.03 + 0.03 * run }),
    meow(p = 1) {
      const t = now(), d = 0.44, o = ctx.createOscillator(), g = gainNode(0, sfxBus);
      o.type = 'sawtooth';
      o.frequency.setValueAtTime(620 * p, t); o.frequency.linearRampToValueAtTime(990 * p, t + d * 0.3);
      o.frequency.exponentialRampToValueAtTime(560 * p, t + d);
      const lfo = ctx.createOscillator(); lfo.frequency.value = 7; lfo.connect(gainNode(14, o.frequency)); lfo.start(t); lfo.stop(t + d + 0.1);
      // Deux formants mobiles : c'est eux qui articulent « mi-a-ou ».
      const f1 = ctx.createBiquadFilter(), f2 = ctx.createBiquadFilter();
      f1.type = f2.type = 'bandpass'; f1.Q.value = 4; f2.Q.value = 7; f2.frequency.value = 3000;
      f1.frequency.setValueAtTime(900, t); f1.frequency.linearRampToValueAtTime(1900, t + d * 0.35); f1.frequency.linearRampToValueAtTime(950, t + d);
      o.connect(f1); o.connect(f2); f1.connect(g); f2.connect(gainNode(0.4, g));
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.32, t + 0.05);
      g.gain.linearRampToValueAtTime(0.22, t + d * 0.6); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
      o.start(t); o.stop(t + d + 0.05);
    },
    yawn() { tone({ type: 'triangle', f: 540, f2: 250, a: 0.3, d: 0.9, gain: 0.06, vibrato: 5 }); noise({ type: 'lowpass', f: 1100, f2: 500, a: 0.35, d: 0.8, gain: 0.035 }); },
    swish: () => noise({ f: 1200, f2: 3200, q: 1.5, a: 0.02, d: 0.14, gain: 0.12 }),
    whoosh: () => noise({ f: 380, f2: 2200, q: 1.2, a: 0.14, d: 0.3, gain: 0.2 }),
    thud() { tone({ f: 130, f2: 45, a: 0.003, d: 0.2, gain: 0.5 }); noise({ type: 'lowpass', f: 420, a: 0.002, d: 0.08, gain: 0.22 }); },
    boing() {   // ressort de dessin animé : une hauteur qui tremble en s'amortissant
      const t = now(), o = ctx.createOscillator(), g = gainNode(0, sfxBus), curve = new Float32Array(64);
      for (let i = 0; i < 64; i++) { const x = i / 63 * 0.6; curve[i] = 300 + 170 * Math.exp(-5 * x) * Math.sin(TAU * 11 * x); }
      o.type = 'triangle'; o.frequency.setValueCurveAtTime(curve, t, 0.6);
      envelope(g, t, 0.005, 0.13, 0.6); o.connect(g); o.start(t); o.stop(t + 0.7);
    },
    wiggle() { for (let i = 0; i < 9; i++) noise({ type: 'highpass', f: 5200, t: now() + i * 0.14, a: 0.002, d: 0.03, gain: 0.05 }); },
    sneezeIn() { noise({ f: 800, f2: 2600, q: 2, a: 0.6, d: 0.1, gain: 0.05 }); tone({ f: 700, f2: 1150, a: 0.55, d: 0.1, gain: 0.03 }); },
    sneezeOut() { noise({ type: 'highpass', f: 2200, a: 0.004, d: 0.2, gain: 0.4 }); tone({ f: 1500, f2: 700, a: 0.005, d: 0.15, gain: 0.1 }); },
    tink(v = 1) { [[2100, 0.35, 0.1], [3150, 0.25, 0.06], [4700, 0.15, 0.03]].forEach(([f, d, g]) => tone({ f, a: 0.002, d, gain: g * v })); },
    scrape: d => noise({ f: 2600, q: 4, a: 0.1, d, gain: 0.05 }),
    crash() {
      const t = now();
      noise({ type: 'highpass', f: 1800, a: 0.002, d: 0.5, gain: 0.45 }); noise({ f: 900, a: 0.002, d: 0.2, gain: 0.3 });
      for (let i = 0; i < 9; i++) tone({ f: 1500 + Math.random() * 4500, t: t + Math.random() * 0.4, a: 0.002, d: 0.12 + Math.random() * 0.25, gain: 0.06 });
      fx.thud();
    },
    whistle() {   // un petit air innocent
      let t = now() + 0.1;
      for (const [m, d] of [[88, 0.2], [91, 0.2], [88, 0.2], [84, 0.38], [86, 0.2], [88, 0.2], [91, 0.5]]) {

        noise({ f: mtof(m), q: 14, t, a: 0.03, d: d * 0.9, gain: 0.04 });
        t += d + 0.03;

    },
    pat() { tone({ f: 300, f2: 170, a: 0.003, d: 0.08, gain: 0.2 }); noise({ type: 'lowpass', f: 800, a: 0.002, d: 0.05, gain: 0.1 }); },

    purr(on) { purring = on; },

  /* Les bruitages demandés avant le premier clic sont simplement ignorés. */
  const sfx = new Proxy({}, { get: (_, name) => (...args) => { if (name === 'purr') purring = !!args[0]; else if (ctx && ctx.state === 'running' && fx[name]) fx[name](...args); } });

  const setMuted = m => { muted = m; if (ctx) master.gain.setTargetAtTime(m ? 0 : 0.9, now(), 0.05); };

})();

/* ==========================================================================
   11. LE RÉCIT
   Écrit avec des générateurs : chaque `yield` rend la main jusqu'à l'image
   suivante. Les scènes se lisent alors comme un script, de haut en bas.
   ========================================================================== */

/** Attend `sec` secondes ; `fn(k, dt)` est appelée à chaque image (k : 0..1). */
function* wait(sec, fn) { let t = 0; while (t < sec) { const dt = yield; t += dt; if (fn) fn(Math.min(t / sec, 1), dt); } }
/** Attend qu'une condition devienne vraie (avec une durée maximale de sécurité). */
function* until(cond, max = 8) { let t = 0; while (!cond() && t < max) t += yield; }
/** Fait marcher le chaton jusqu'à l'abscisse x. */
function* walkTo(x, speed = 1.1) {
  const dir = Math.sign(x - K.x) || 1;
  // Anticipation : il se ramasse un instant avant de partir.
  if (K.speed < 0.1 && Math.abs(x - K.x) > 0.8) { K.set({ crouch: 0.4 }); yield* wait(0.16); K.set({ crouch: 0 }); }
  let v = 0;
  while ((x - K.x) * dir > 0.005) {
    const dt = yield, rem = Math.abs(x - K.x);
    // L'allure n'est jamais parfaitement régulière.
    const pace = speed * (1 + 0.1 * Math.sin(time * 2.3) + 0.06 * Math.sin(time * 5.1 + 1));
    v = damp(v, Math.min(pace, 0.35 + rem * 3), 5, dt);
    K.x += dir * Math.min(v * dt, rem);
  }
  K.snap({ jump: 0 });
}
/** Un bond : avance de dx en décrivant une cloche de hauteur h. */
function* hop(dx, h, dur, fn, prep = 0.2) {
  // Un saut se prépare : il se ramasse, pousse en s'étirant, plane, puis amortit en pliant les pattes.
  if (prep > 0) { K.set({ crouch: 0.85, earBack: 0.35 }); yield* wait(prep); K.snap({ squash: 1.14 }); K.set({ crouch: 0, earBack: 0 }); }
  const x0 = K.x;
  yield* wait(dur, k => {
    const e = k < 0.5 ? 0.5 * easeOut(k * 2) : 0.5 + 0.5 * (1 - easeOut(2 - k * 2));   // il décolle vite, flotte en haut, retombe vite
    K.x = x0 + dx * k; K.snap({ jump: 4 * h * e * (1 - e) }); if (fn) fn(k);
  });
  K.snap({ jump: 0, squash: 0.76, crouch: 0.55 }); K.set({ squash: 1, crouch: 0 });   // réception amortie
}
/** Renvoie une fonction qui déclenche `fn` à intervalle régulier. */
const every = (period, fn) => { let acc = period * 0.7; return (k, dt) => { acc += dt; if (acc >= period) { acc -= period; fn(); } }; };
/** Règle le plan de caméra visé et la vitesse à laquelle on le rejoint. */
const shot = (o, rate = 0.8) => { Object.assign(camGoal, o); camRate = rate; };
function* meow(pitch = 1) { sfx.meow(pitch); K.set({ mouth: 1, eyeOpen: 0.55 }); yield* wait(0.34); K.set({ mouth: 0, eyeOpen: 1 }); }

/* Tâches d'arrière-plan (par exemple le lever de lune pendant que le chaton marche). */
const tasks = [];
const spawn = gen => { gen.next(); tasks.push(gen); };

const fadeEl = document.getElementById('fade');

/* Pose du sommeil : couché en rond, la queue ramenée contre lui. */
const SLEEP = { lie: 1, eyeOpen: 0, tailWrap: 1, tailUp: -0.9, tailWag: 0.04, yaw: 0.95, headYaw: -0.55, headPitch: -0.22, headRoll: -0.18, earBack: 0.15 };
const zzz = every(1.5, () => emote('z', ...overHead(0.05), { size: 0.17, life: 2.6, vx: 0.1, vy: 0.26, sway: 0.12, grow: 0.25, tilt: -0.2 }));

/** Remet le monde dans son état initial (au premier lancement et à chaque boucle). */
function resetWorld(sceneIndex = 1) {
  const starts = [{ x: X_START, tod: 0 }, { x: 0.2, tod: 0.08 }, { x: 9.5, tod: 0.25 }, { x: 18.5, tod: 0.42 }, { x: 45.5, tod: 0.74 }];
  const s = starts[sceneIndex - 1];
  K.x = K.prevX = s.x; K.lookTarget = null; K.reach = null; K.rate = 7;
  K.snap({ ...K.defaults, ...(sceneIndex === 1 ? SLEEP : {}) });
  world.tod = world.todGoal = s.tod; world.todRate = 0.2; world.moon = 0; world.shake = 0;
  F.amount = F.level = 0; F.heroOn = 0; F.aim = null;
  V.reset(); Y.reset(); B.hide(); tasks.length = 0;
